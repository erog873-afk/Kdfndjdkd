<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vellori Stars — Магазин</title>
<style>
  :root{
    --bg:#0d0b14;
    --card:#171320;
    --card-border:#241f30;
    --purple1:#7c6cf5;
    --purple2:#9d87ff;
    --gold:#f5c542;
    --text:#f2f0f8;
    --text-dim:#9891a8;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
  }
  .phone{
    width:100%;
    max-width:430px;
    min-height:100vh;
    display:flex;
    flex-direction:column;
  }
  .grid{
    flex:1;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
    padding:16px;
  }
  .gift-card{
    background:var(--card);
    border:1px solid var(--card-border);
    border-radius:20px;
    padding:20px 14px 16px;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
  }
  .gift-icon{
    margin-bottom:12px;
    filter:drop-shadow(0 4px 10px rgba(0,0,0,0.4));
  }
  .gift-icon img{
    width:56px;
    height:56px;
    object-fit:contain;
  }
  .gift-name{
    font-size:15px;
    font-weight:700;
    margin-bottom:6px;
    min-height:38px;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .gift-price{
    color:var(--gold);
    font-weight:700;
    font-size:16px;
    margin-bottom:12px;
  }
  .buy-btn{
    width:100%;
    padding:11px 0;
    border:none;
    border-radius:12px;
    background:linear-gradient(135deg,var(--purple1),var(--purple2));
    color:#fff;
    font-size:15px;
    font-weight:700;
    cursor:pointer;
  }
  .buy-btn:active{opacity:.85;}
</style>
</head>
<body>
<div class="phone">

  <div class="grid" id="giftGrid"></div>

</div>

<script>
  const ICON_URL = "https://telegifter.ru/wp-content/themes/gifts/assets/img/gifts/noupdate/Christmas%20Tree.webp";
  const GIFTS = [
    { name: "Мишка Чемпионата мира" },
    { name: "Новогодний мишка" },
    { name: "Пасха" },
    { name: "Сердце 14 февраля" },
    { name: "Ёлка" },
    { name: "Мишка 1 апреля" },
    { name: "Мишка 1 мая" },
    { name: "Мишка 14 февраля" },
    { name: "Мишка 17 марта" },
    { name: "Мишка 8 марта" },
  ];
  const PRICE = 550;

  const grid = document.getElementById("giftGrid");
  GIFTS.forEach(g => {
    const card = document.createElement("div");
    card.className = "gift-card";
    card.innerHTML = `
      <div class="gift-icon"><img src="${ICON_URL}" alt="${g.name}"></div>
      <div class="gift-name">${g.name}</div>
      <div class="gift-price">${PRICE} ₸</div>
      <button class="buy-btn">Купить</button>
    `;
    grid.appendChild(card);
  });
</script>
</body>
</html>
