<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
               maximum-scale=1.0, user-scalable=no">

<title>Frog Crash</title>

<style>
:root{
  --bg:#05070a;
  --panel:#11141a;
  --panel2:#171b23;
  --panel3:#1d2230;

  --text:#f5f6f8;
  --muted:#777e8c;

  --purple:#6d4dff;
  --purple2:#8c6fff;

  --green:#38e07b;
  --red:#ff4d5e;
  --yellow:#ffd34e;

  --radius:18px;
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:var(--bg);
  color:var(--text);
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Roboto,
    Arial,
    sans-serif;
}

button,
input{
  font:inherit;
}

button{
  border:0;
  outline:none;
}

#app{
  position:relative;
  width:100%;
  height:100dvh;
  min-height:560px;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

/* =========================================================
   BACKGROUND
========================================================= */

#stars{
  position:absolute;
  inset:0;
  z-index:0;
  overflow:hidden;

  background:
    radial-gradient(
      ellipse at 50% -10%,
      #111a35 0%,
      #090d17 38%,
      #05070a 72%
    );
}

.star{
  position:absolute;
  width:2px;
  height:2px;
  border-radius:50%;
  background:#fff;

  animation:
    twinkle var(--duration)
    ease-in-out infinite;

  animation-delay:var(--delay);

  opacity:.2;
}

@keyframes twinkle{

  0%,100%{
    opacity:.12;
    transform:scale(1);
  }

  50%{
    opacity:.9;
    transform:scale(1.45);
  }
}

/* =========================================================
   HEADER
========================================================= */

header{
  position:relative;
  z-index:5;

  height:54px;

  display:flex;
  align-items:center;
  justify-content:center;

  padding:
    10px
    14px
    6px;
}

.title{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:7px;

  font-size:17px;
  font-weight:800;
}

.title-icon{
  width:27px;
  height:27px;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:50%;

  background:#1b2030;

  font-size:15px;
}

/* =========================================================
   TOP BAR
========================================================= */

.topbar{
  position:relative;
  z-index:5;

  display:flex;
  align-items:center;

  padding:
    2px 12px 8px;

  gap:8px;
}

.live{
  flex-shrink:0;

  font-size:10px;
  font-weight:900;
  letter-spacing:1.2px;

  color:var(--red);

  writing-mode:vertical-rl;
}

.top-chip{
  display:flex;
  align-items:center;
  gap:6px;

  min-height:35px;

  padding:
    8px 12px;

  border-radius:14px;

  background:var(--panel2);

  color:#fff;

  font-size:13px;
  font-weight:800;
}

.balance{
  margin-left:auto;
  background:#1c2130;
}

.star-icon{
  width:18px;
  height:18px;

  display:inline-flex;
  align-items:center;
  justify-content:center;

  flex-shrink:0;

  font-size:16px;
}

.balance-plus{
  width:18px;
  height:18px;

  display:flex;
  align-items:center;
  justify-content:center;

  margin-left:2px;

  border-radius:50%;

  background:#fff;
  color:#111;

  font-size:14px;
  font-weight:900;
}

/* =========================================================
   GAME AREA
========================================================= */

.game{
  position:relative;
  z-index:2;

  flex:1;
  min-height:0;

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;

  padding:
    0 10px 4px;
}

.round-state{
  position:absolute;
  top:13px;

  padding:6px 12px;

  border-radius:20px;

  background:rgba(255,255,255,.05);

  color:var(--muted);

  font-size:11px;
  font-weight:800;

  text-transform:uppercase;
  letter-spacing:.5px;
}

.round-state.live{
  color:var(--green);
}

.round-state.crashed{
  color:var(--red);
}

.multiplier{
  font-size:min(22vw,92px);
  line-height:1;

  letter-spacing:-4px;

  font-weight:900;

  color:#f5f6f8;

  text-shadow:
    0 0 25px rgba(255,255,255,.04);

  transition:
    color .15s,
    transform .15s;
}

.multiplier.live{
  color:#fff;
  transform:scale(1.02);
}

.multiplier.crashed{
  color:var(--red);

  text-shadow:
    0 0 30px rgba(255,77,94,.25);
}

.game-sub{
  margin-top:8px;

  color:var(--muted);

  font-size:12px;
  font-weight:600;
}

/* =========================================================
   HISTORY
========================================================= */

.history-wrap{
  position:relative;
  z-index:5;

  width:100%;

  overflow-x:auto;

  scrollbar-width:none;

  padding:
    0 12px 10px;
}

.history-wrap::-webkit-scrollbar{
  display:none;
}

.history{
  display:flex;
  gap:7px;

  width:max-content;
}

.history-pill{
  min-width:72px;

  padding:
    9px 12px;

  border-radius:12px;

  text-align:center;

  background:
    linear-gradient(
      135deg,
      var(--purple),
      var(--purple2)
    );

  color:#fff;

  font-size:13px;
  font-weight:900;
}

.history-pill.low{
  background:#1b202b;
  color:#a8afbc;
}

.history-pill.high{
  background:
    linear-gradient(
      135deg,
      #1d8051,
      #36d779
    );
}

/* =========================================================
   BET PANEL
========================================================= */

.bet-panel{
  position:relative;
  z-index:5;

  width:calc(100% - 14px);

  margin:
    0 7px;

  padding:
    12px 12px 8px;

  border-radius:
    20px 20px 0 0;

  background:var(--panel);

  box-shadow:
    0 -10px 35px rgba(0,0,0,.16);

  flex-shrink:0;
}

/* =========================================================
   BET CONTROLS
========================================================= */

.bet-controls{
  display:flex;
  gap:8px;
  align-items:stretch;
}

.amount-box{
  flex:1;

  min-width:0;

  display:flex;
  align-items:center;

  background:var(--panel2);

  border-radius:14px;

  overflow:hidden;
}

.amount-button{
  width:37px;
  height:42px;

  flex-shrink:0;

  background:transparent;

  color:#cdd1da;

  font-size:22px;
  font-weight:600;

  cursor:pointer;
}

.amount-button:active{
  background:#242a36;
}

.amount-input-wrap{
  flex:1;

  display:flex;
  align-items:center;
  justify-content:center;

  min-width:0;
}

.amount-input{
  width:100%;

  padding:0 2px;

  border:0;
  outline:0;

  background:transparent;

  color:#fff;

  text-align:center;

  font-size:16px;
  font-weight:900;
}

.amount-input::-webkit-outer-spin-button,
.amount-input::-webkit-inner-spin-button{
  -webkit-appearance:none;
  margin:0;
}

.amount-input[type=number]{
  appearance:textfield;
}

.amount-star{
  padding-right:8px;

  font-size:15px;
}

/* =========================================================
   AUTO CASHOUT
========================================================= */

.auto-box{
  width:112px;

  flex-shrink:0;

  display:flex;
  flex-direction:column;
  justify-content:center;

  padding:
    6px 10px;

  border-radius:14px;

  background:var(--panel2);
}

.auto-label{
  color:var(--muted);

  font-size:9px;
  font-weight:800;

  text-transform:uppercase;
}

.auto-row{
  display:flex;
  align-items:center;
  gap:5px;
}

.auto-input{
  width:56px;

  padding:2px 0;

  border:0;
  outline:0;

  background:transparent;

  color:#fff;

  font-size:14px;
  font-weight:900;
}

.auto-input::-webkit-outer-spin-button,
.auto-input::-webkit-inner-spin-button{
  -webkit-appearance:none;
  margin:0;
}

.auto-input[type=number]{
  appearance:textfield;
}

.auto-x{
  color:var(--purple2);

  font-size:14px;
  font-weight:900;
}

/* =========================================================
   BET BUTTON
========================================================= */

.bet-button{
  width:100%;

  margin-top:8px;

  height:46px;

  border-radius:14px;

  background:#fff;
  color:#080a0e;

  font-size:15px;
  font-weight:900;

  cursor:pointer;

  transition:
    transform .08s,
    opacity .15s;
}

.bet-button:active{
  transform:scale(.985);
}

.bet-button.cancel{
  background:#292e3a;
  color:#fff;
}

.bet-button.disabled{
  opacity:.45;
  cursor:not-allowed;
}

/* =========================================================
   PLAYERS
========================================================= */

.players-header{
  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:
    12px 2px 7px;

  color:var(--muted);

  font-size:11px;
  font-weight:700;
}

.bets-list{
  max-height:105px;

  overflow-y:auto;

  scrollbar-width:none;
}

.bets-list::-webkit-scrollbar{
  display:none;
}

.empty{
  padding:
    10px 5px 12px;

  text-align:center;

  color:var(--muted);

  font-size:12px;
}

.bet-row{
  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:
    5px 0;
}

.user{
  display:flex;
  align-items:center;
  gap:8px;
}

.avatar{
  width:30px;
  height:30px;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:50%;

  color:#fff;

  font-size:12px;
  font-weight:900;
}

.user-name{
  font-size:12px;
  font-weight:800;
}

.user-amount{
  margin-top:1px;

  color:var(--yellow);

  font-size:10px;
  font-weight:800;
}

.user-coef{
  font-size:12px;
  font-weight:900;
  color:var(--muted);
}

.user-coef.win{
  color:var(--green);
}

.user-coef.lost{
  color:var(--red);
}

/* =========================================================
   TOAST
========================================================= */

.toast{
  position:fixed;
  left:50%;
  bottom:175px;

  z-index:100;

  transform:
    translate(-50%,20px);

  opacity:0;
  pointer-events:none;

  padding:
    10px 14px;

  border-radius:12px;

  background:#fff;
  color:#090b0f;

  font-size:12px;
  font-weight:800;

  transition:
    opacity .2s,
    transform .2s;
}

.toast.show{
  opacity:1;

  transform:
    translate(-50%,0);
}

/* =========================================================
   SMALL SCREENS
========================================================= */

@media(max-height:650px){

  .game{
    padding-top:4px;
  }

  .multiplier{
    font-size:min(20vw,76px);
  }

  .bet-panel{
    padding-top:9px;
  }

  .bets-list{
    max-height:75px;
  }

  .players-header{
    padding-top:8px;
  }

}

/* =========================================================
   VERY SMALL WIDTH
========================================================= */

@media(max-width:340px){

  .auto-box{
    width:100px;
  }

  .amount-button{
    width:32px;
  }

  .bet-panel{
    padding-left:8px;
    padding-right:8px;
  }

}
</style>
</head>

<body>

<div id="app">

  <!-- =====================================================
       BACKGROUND
  ====================================================== -->

  <div id="stars"></div>


  <!-- =====================================================
       HEADER
  ====================================================== -->

  <header>

    <div class="title">

      <span class="title-icon">
        🐸
      </span>

      Frog Crash

    </div>

  </header>


  <!-- =====================================================
       TOP BAR
  ====================================================== -->

  <div class="topbar">

    <div class="live">
      LIVE
    </div>

    <div class="top-chip">
      <span>Мин.</span>
      <span>25</span>
      <span class="star-icon">⭐</span>
    </div>

    <div class="top-chip balance">

      <span class="star-icon">⭐</span>

      <span id="balance">
        1000
      </span>

      <span class="balance-plus">
        +
      </span>

    </div>

  </div>


  <!-- =====================================================
       GAME
  ====================================================== -->

  <main class="game">

    <div
      id="roundState"
      class="round-state"
    >
      Ожидание
    </div>

    <div
      id="multiplier"
      class="multiplier"
    >
      x1.00
    </div>

    <div
      id="gameSub"
      class="game-sub"
    >
      Новый раунд запускается автоматически
    </div>

  </main>


  <!-- =====================================================
       HISTORY
  ====================================================== -->

  <div class="history-wrap">

    <div
      id="history"
      class="history"
    ></div>

  </div>


  <!-- =====================================================
       BET PANEL
  ====================================================== -->

  <section class="bet-panel">

    <div class="bet-controls">


      <!-- AMOUNT -->

      <div class="amount-box">

        <button
          id="minusBtn"
          class="amount-button"
          type="button"
        >
          −
        </button>

        <div class="amount-input-wrap">

          <input
            id="amountInput"
            class="amount-input"
            type="number"
            min="25"
            step="1"
            value="25"
            inputmode="numeric"
          >

        </div>

        <span class="amount-star">
          ⭐
        </span>

        <button
          id="plusBtn"
          class="amount-button"
          type="button"
        >
          +
        </button>

      </div>


      <!-- AUTO CASHOUT -->

      <div class="auto-box">

        <div class="auto-label">
          Автовывод
        </div>

        <div class="auto-row">

          <span class="auto-x">
            x
          </span>

          <input
            id="autoInput"
            class="auto-input"
            type="number"
            min="1.10"
            step="0.01"
            value="1.10"
            inputmode="decimal"
          >

        </div>

      </div>

    </div>


    <!-- BET BUTTON -->

    <button
      id="betButton"
      class="bet-button"
      type="button"
    >
      Поставить ⭐ 25
    </button>


    <!-- PLAYERS HEADER -->

    <div class="players-header">

      <span>
        Пользователь
      </span>

      <span>
        Коэффициент
      </span>

    </div>


    <!-- PLAYERS -->

    <div
      id="betsList"
      class="bets-list"
    >

      <div class="empty">
        Ставок пока нет
      </div>

    </div>

  </section>


  <!-- TOAST -->

  <div
    id="toast"
    class="toast"
  ></div>

</div>


<script>
/* =========================================================
   STARFIELD
========================================================= */

const stars = document.getElementById("stars");

for(let i = 0; i < 70; i++){

  const star = document.createElement("div");

  star.className = "star";

  const size =
    Math.random() * 2 + 1;

  star.style.width =
    size + "px";

  star.style.height =
    size + "px";

  star.style.left =
    Math.random() * 100 + "%";

  star.style.top =
    Math.random() * 100 + "%";

  star.style.setProperty(
    "--duration",
    (2 + Math.random() * 3).toFixed(2) + "s"
  );

  star.style.setProperty(
    "--delay",
    (Math.random() * 3).toFixed(2) + "s"
  );

  stars.appendChild(star);
}


/* =========================================================
   ELEMENTS
========================================================= */

const multiplierEl =
  document.getElementById("multiplier");

const roundStateEl =
  document.getElementById("roundState");

const gameSubEl =
  document.getElementById("gameSub");

const historyEl =
  document.getElementById("history");

const betsListEl =
  document.getElementById("betsList");

const amountInput =
  document.getElementById("amountInput");

const autoInput =
  document.getElementById("autoInput");

const minusBtn =
  document.getElementById("minusBtn");

const plusBtn =
  document.getElementById("plusBtn");

const betButton =
  document.getElementById("betButton");

const balanceEl =
  document.getElementById("balance");

const toastEl =
  document.getElementById("toast");


/* =========================================================
   GAME SETTINGS
========================================================= */

const MIN_BET = 25;

/*
  Только демонстрационный баланс.
  Для настоящего онлайн-сервера этот баланс
  НЕЛЬЗЯ хранить здесь.
*/

let balance = 1000;


/*
  Скорость роста коэффициента.

  Игра не ждёт ставок.
  После окончания раунда следующий
  начинается автоматически.
*/

const TICK_MS = 80;

const GROWTH =
  1.0056;


/*
  Время между падением и новым раундом.
*/

const CRASH_DELAY = 1800;


/*
  Время ожидания перед стартом.

  Здесь специально короткая пауза.
  Можно поставить 0, если нужно вообще
  без ожидания.
*/

const ROUND_PAUSE = 1200;


/* =========================================================
   STATE
========================================================= */

let phase = "running";

let multiplier = 1.00;

let crashPoint = 2.00;

let roundId = 0;

let gameTimer = null;

let restartTimer = null;

let history = [];

let bets = [];

let myBet = null;


/* =========================================================
   DEMO PLAYERS
========================================================= */

const names = [
  "s73uu34",
  "derqyy",
  "qobolq",
  "elessoon",
  "stunt_zames",
  "nika_v",
  "frog_lord",
  "alex777",
  "cryptofox"
];

const avatarColors = [
  "#38c7c7",
  "#e05c5c",
  "#8a6bff",
  "#ffb454",
  "#38e07b",
  "#ff6bd6"
];


/* =========================================================
   HELPERS
========================================================= */

function clamp(
  value,
  min,
  max
){

  return Math.max(
    min,
    Math.min(max,value)
  );

}


function showToast(text){

  toastEl.textContent =
    text;

  toastEl.classList.add(
    "show"
  );

  clearTimeout(
    showToast.timer
  );

  showToast.timer =
    setTimeout(() => {

      toastEl.classList.remove(
        "show"
      );

    },1500);

}


/* =========================================================
   BALANCE
========================================================= */

function renderBalance(){

  balanceEl.textContent =
    Math.floor(balance);

}


/* =========================================================
   AMOUNT
========================================================= */

function getAmount(){

  let value =
    parseInt(
      amountInput.value,
      10
    );

  if(!Number.isFinite(value)){
    value = MIN_BET;
  }

  value =
    Math.floor(value);

  value =
    Math.max(
      MIN_BET,
      value
    );

  return value;

}


function setAmount(value){

  value =
    Math.floor(
      Number(value)
    );

  if(!Number.isFinite(value)){
    value = MIN_BET;
  }

  value =
    Math.max(
      MIN_BET,
      value
    );

  amountInput.value =
    value;

  updateBetButton();

}


amountInput.addEventListener(
  "input",
  () => {

    updateBetButton();

  }
);


/* =========================================================
   MINUS / PLUS
========================================================= */

minusBtn.addEventListener(
  "click",
  () => {

    const value =
      getAmount();

    setAmount(
      Math.max(
        MIN_BET,
        value - 25
      )
    );

  }
);


plusBtn.addEventListener(
  "click",
  () => {

    const value =
      getAmount();

    setAmount(
      value + 25
    );

  }
);


/* =========================================================
   AUTO CASHOUT
========================================================= */

function getAutoCashout(){

  let value =
    parseFloat(
      autoInput.value
    );

  if(!Number.isFinite(value)){
    value = 1.10;
  }

  value =
    Math.max(
      1.10,
      value
    );

  return value;

}


autoInput.addEventListener(
  "change",
  () => {

    autoInput.value =
      getAutoCashout().toFixed(2);

  }
);


/* =========================================================
   CRASH POINT
=========================================================

   Это локальная демонстрационная генерация.

   В настоящей онлайн-игре результат должен
   рассчитываться сервером ДО/В момент раунда,
   а клиент только получает подтверждённый
   результат.
========================================================= */

function generateCrashPoint(){

  const r =
    Math.random();

  /*
    Небольшая вероятность очень раннего падения.
  */

  if(r < 0.08){

    return 1.00 +
      Math.random() * 0.15;

  }


  /*
    Обычные низкие значения.
  */

  if(r < 0.60){

    return 1.10 +
      Math.random() * 1.20;

  }


  /*
    Средние.
  */

  if(r < 0.90){

    return 2.30 +
      Math.random() * 3.50;

  }


  /*
    Редкие высокие значения.
  */

  return 5.80 +
    Math.random() * 8.00;

}


/* =========================================================
   HISTORY
========================================================= */

function renderHistory(){

  historyEl.innerHTML = "";

  history
    .slice(-7)
    .reverse()
    .forEach(value => {

      const item =
        document.createElement("div");

      item.className =
        "history-pill";

      if(value < 2){
        item.classList.add("low");
      }

      if(value >= 5){
        item.classList.add("high");
      }

      item.textContent =
        "x" + value.toFixed(2);

      historyEl.appendChild(
        item
      );

    });

}


/* =========================================================
   BET LIST
========================================================= */

function renderBets(){

  if(bets.length === 0){

    betsListEl.innerHTML = `
      <div class="empty">
        Ставок пока нет
      </div>
    `;

    return;

  }


  betsListEl.innerHTML =
    bets.map(bet => {

      let coef =
        multiplier;


      if(bet.cashed){

        coef =
          bet.cashoutMultiplier;

      }


      if(bet.lost){

        coef =
          crashPoint;

      }


      let className =
        "user-coef";


      if(bet.cashed){
        className += " win";
      }

      if(bet.lost){
        className += " lost";
      }


      return `

        <div class="bet-row">

          <div class="user">

            <div
              class="avatar"
              style="background:${bet.color}"
            >
              ${bet.name[0].toUpperCase()}
            </div>

            <div>

              <div class="user-name">
                ${bet.name}
              </div>

              <div class="user-amount">
                ⭐ ${bet.amount}
              </div>

            </div>

          </div>

          <div class="${className}">
            x${coef.toFixed(2)}
          </div>

        </div>

      `;

    }).join("");

}


/* =========================================================
   ADD DEMO PLAYER
========================================================= */

function addDemoBet(){

  if(
    bets.length >= 8
  ){
    return;
  }


  const name =
    names[
      Math.floor(
        Math.random() *
        names.length
      )
    ];


  const color =
    avatarColors[
      Math.floor(
        Math.random() *
        avatarColors.length
      )
    ];


  const amountOptions =
    [25,50,75,100,200];


  const amount =
    amountOptions[
      Math.floor(
        Math.random() *
        amountOptions.length
      )
    ];


  bets.push({

    id:
      "bot_" +
      Math.random(),

    name,

    color,

    amount,

    coef:1,

    cashed:false,

    lost:false,

    cashoutMultiplier:0

  });


  renderBets();

}


/* =========================================================
   MY BET
========================================================= */

function placeMyBet(){

  if(myBet){

    showToast(
      "Ставка уже сделана"
    );

    return;

  }


  const amount =
    getAmount();


  const autoCashout =
    getAutoCashout();


  if(amount < MIN_BET){

    showToast(
      "Минимальная ставка — 25 ⭐"
    );

    setAmount(
      MIN_BET
    );

    return;

  }


  if(amount > balance){

    showToast(
      "Недостаточно ⭐"
    );

    return;

  }


  /*
    Списываем виртуальные звёзды.
  */

  balance -= amount;

  renderBalance();


  myBet = {

    id:"me",

    name:"Вы",

    color:"#6d4dff",

    amount,

    autoCashout,

    coef:multiplier,

    cashed:false,

    lost:false,

    cashoutMultiplier:0

  };


  bets.unshift(
    myBet
  );


  renderBets();

  updateBetButton();


  showToast(
    "Ставка принята ⭐ " +
    amount
  );

}


/* =========================================================
   MANUAL CASHOUT
========================================================= */

function cashoutMyBet(){

  if(!myBet){
    return;
  }


  if(
    myBet.cashed ||
    myBet.lost
  ){
    return;
  }


  const cashMultiplier =
    multiplier;


  myBet.cashed =
    true;

  myBet.cashoutMultiplier =
    cashMultiplier;

  myBet.coef =
    cashMultiplier;


  /*
    Возврат ставки × коэффициент.
  */

  const win =
    myBet.amount *
    cashMultiplier;


  balance += win;

  renderBalance();

  renderBets();

  updateBetButton();


  showToast(
    "Вывод x" +
    cashMultiplier.toFixed(2)
  );

}


/* =========================================================
   AUTO CASHOUT
========================================================= */

function checkAutoCashout(){

  if(!myBet){
    return;
  }


  if(
    myBet.cashed ||
    myBet.lost
  ){
    return;
  }


  if(
    multiplier >=
    myBet.autoCashout
  ){

    /*
      Автоматический вывод
      происходит до следующего тика.
    */

    const cashMultiplier =
      myBet.autoCashout;


    myBet.cashed =
      true;

    myBet.cashoutMultiplier =
      cashMultiplier;


    const win =
      myBet.amount *
      cashMultiplier;


    balance += win;

    renderBalance();

    renderBets();

    updateBetButton();


    showToast(
      "Автовывод x" +
      cashMultiplier.toFixed(2)
    );

  }

}


/* =========================================================
   BET BUTTON
========================================================= */

function updateBetButton(){

  const amount =
    getAmount();


  if(myBet){

    if(
      myBet.cashed ||
      myBet.lost
    ){

      betButton.textContent =
        "Следующая ставка";

      betButton.classList.remove(
        "cancel"
      );

      return;

    }


    betButton.textContent =
      "Вывести x" +
      multiplier.toFixed(2);

    betButton.classList.add(
      "cancel"
    );

    return;

  }


  betButton.classList.remove(
    "cancel"
  );


  betButton.textContent =
    "Поставить ⭐ " +
    amount;

}


/* =========================================================
   BUTTON
========================================================= */

betButton.addEventListener(
  "click",
  () => {

    /*
      Если ставки нет —
      ставим её даже во время
      уже идущего раунда.
    */

    if(!myBet){

      placeMyBet();

      return;

    }


    /*
      Если уже проиграла/завершилась —
      разрешаем новую ставку.
    */

    if(
      myBet.lost ||
      myBet.cashed
    ){

      /*
        Убираем предыдущую ставку
        из списка пользователя.
      */

      bets =
        bets.filter(
          b => b !== myBet
        );

      myBet = null;

      renderBets();

      updateBetButton();

      return;

    }


    /*
      Иначе — ручной вывод.
    */

    cashoutMyBet();

  }
);


/* =========================================================
   ROUND UI
========================================================= */

function setRunningUI(){

  roundStateEl.textContent =
    "Раунд идёт";

  roundStateEl.className =
    "round-state live";


  multiplierEl.className =
    "multiplier live";


  gameSubEl.textContent =
    "Можно поставить во время раунда";

}


function setCrashedUI(){

  roundStateEl.textContent =
    "Крах";

  roundStateEl.className =
    "round-state crashed";


  multiplierEl.className =
    "multiplier crashed";


  gameSubEl.textContent =
    "Новый раунд запускается автоматически";

}


/* =========================================================
   START ROUND
========================================================= */

function startRound(){

  clearInterval(
    gameTimer
  );

  clearTimeout(
    restartTimer
  );


  roundId++;


  phase =
    "running";


  multiplier =
    1.00;


  crashPoint =
    generateCrashPoint();


  /*
    Новая ставка доступна
    после предыдущего раунда.
  */

  myBet = null;


  /*
    Удаляем старые demo bets.
  */

  bets = [];


  renderBets();


  multiplierEl.textContent =
    "x1.00";


  setRunningUI();

  updateBetButton();


  /*
    Добавляем несколько игроков
    независимо от наличия ставок
    пользователя.
  */

  setTimeout(
    addDemoBet,
    250
  );

  setTimeout(
    addDemoBet,
    550
  );

  setTimeout(
    addDemoBet,
    850
  );


  /*
    ОСНОВНОЙ ЦИКЛ
  */

  gameTimer =
    setInterval(
      () => {

        if(
          phase !== "running"
        ){

          clearInterval(
            gameTimer
          );

          return;

        }


        multiplier *=
          GROWTH;


        /*
          Проверяем автовывод
          ДО проверки краха.
        */

        checkAutoCashout();


        /*
          Обновляем коэффициенты
          ботов.
        */

        bets.forEach(
          bet => {

            if(
              bet.cashed ||
              bet.lost
            ){
              return;
            }


            /*
              Некоторые боты
              случайно выводятся.
            */

            if(
              Math.random() < 0.018 &&
              multiplier > 1.15 &&
              multiplier < crashPoint
            ){

              bet.cashed =
                true;

              bet.cashoutMultiplier =
                multiplier;

            }

          }
        );


        /*
          КРАХ
        */

        if(
          multiplier >=
          crashPoint
        ){

          multiplier =
            crashPoint;


          clearInterval(
            gameTimer
          );


          crashRound();


          return;

        }


        multiplierEl.textContent =
          "x" +
          multiplier.toFixed(2);


        /*
          Если игрок ещё не вывелся,
          кнопка показывает текущий
          коэффициент.
        */

        updateBetButton();


        renderBets();

      },
      TICK_MS
    );

}


/* =========================================================
   CRASH
========================================================= */

function crashRound(){

  phase =
    "crashed";


  multiplierEl.textContent =
    "x" +
    crashPoint.toFixed(2);


  setCrashedUI();


  /*
    Если игрок не успел вывести —
    ставка проигрывает.
  */

  if(myBet){

    if(
      !myBet.cashed
    ){

      myBet.lost =
        true;

      myBet.coef =
        crashPoint;

    }

  }


  /*
    Боты тоже проигрывают,
    если не вывелись.
  */

  bets.forEach(
    bet => {

      if(
        !bet.cashed
      ){

        bet.lost =
          true;

        bet.coef =
          crashPoint;

      }

    }
  );


  /*
    История.
  */

  history.push(
    crashPoint
  );


  if(
    history.length > 20
  ){

    history.shift();

  }


  renderHistory();

  renderBets();

  updateBetButton();


  /*
    Новый раунд автоматически.
  */

  restartTimer =
    setTimeout(
      () => {

        startRound();

      },
      CRASH_DELAY
    );

}


/* =========================================================
   RANDOM DEMO BETS WHILE RUNNING
========================================================= */

setInterval(
  () => {

    if(
      phase === "running" &&
      bets.length < 8 &&
      Math.random() < .65
    ){

      addDemoBet();

    }

  },
  1100
);


/* =========================================================
   INITIAL
========================================================= */

renderBalance();

setAmount(
  25
);

autoInput.value =
  "1.10";


/*
  Игра стартует сразу.
  Никакого ожидания ставок.
*/

startRound();

</script>
