 <!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aviator Telegram</title>
<style>
body{
    margin:0;
    background:#0b1422;
    color:white;
    font-family: 'Segoe UI', Arial, sans-serif;
    text-align:center;
    padding-bottom: 100px;
    box-sizing: border-box;
}

.timer-container {
    position: relative;
    width: 200px;
    height: 100px;
    margin: 80px auto 0;
}

.timer{
    font-size:80px;
    line-height:100px;
    position: absolute;
    top:0;
    left:0;
    width:100%;
    height:100%;
    font-weight: 600;
    text-shadow: 0 0 15px #2f7cff;
}

#sticker-container img{
    position: absolute;
    top:0;
    left:0;
    width:100%;
    height:100%;
    display:none; /* скрыт до нуля */
    object-fit: contain;
}

.status{
    margin-top:10px;
    opacity:0.8;
    font-size: 18px;
    letter-spacing: 1px;
}

.bet-list{
    width:90%;
    margin:30px auto;
    padding:20px;
    background:rgba(255,255,255,0.08);
    border-radius:20px;
    min-height:80px;
    backdrop-filter: blur(4px);
    border: 1px solid rgba(255,255,255,0.1);
}

.bet-item{
    display:flex;
    justify-content:space-between;
    padding:6px 0;
    border-bottom: 1px dashed rgba(255,255,255,0.1);
}
.bet-item:last-child {
    border-bottom: none;
}

button{
    position:fixed;
    bottom:20px;
    left:5%;
    width:90%;
    height:60px;
    border:none;
    border-radius:60px;
    font-size:22px;
    background:#2f7cff;
    color:white;
    font-weight: bold;
    box-shadow: 0 5px 20px rgba(47,124,255,0.4);
    cursor: pointer;
    transition: 0.2s;
}
button:active {
    transform: scale(0.97);
    background: #1a5fd0;
}
button:disabled {
    opacity: 0.5;
    pointer-events: none;
    filter: grayscale(0.6);
}

/* История коэффициентов */
.history-box {
    width: 90%;
    margin: 10px auto;
    padding: 12px 0;
    background: rgba(0, 0, 0, 0.3);
    border-radius: 40px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: 12px;
    border: 1px solid #2f7cff40;
    backdrop-filter: blur(4px);
}
.history-label {
    color: #9aa5b8;
    font-size: 16px;
    margin-right: 5px;
}
.history-coeff {
    background: #1e293b;
    padding: 6px 14px;
    border-radius: 30px;
    font-weight: 700;
    font-size: 18px;
    color: #ffd966;
    box-shadow: inset 0 -2px 0 #00000055;
    border: 1px solid #3f4e6b;
}
.history-coeff.win {
    color: #8affb9;
    text-shadow: 0 0 5px #00b347;
}
</style>
</head>

<body>

<div class="timer-container">
    <div class="timer" id="timer">10</div>
    <div id="sticker-container">
        <!-- временно заменим на эмоджи-стикер, т.к. PN 4.webp может не быть -->
        <span id="sticker" style="font-size: 80px; line-height: 100px; display: none;">🚀</span>
    </div>
</div>

<div class="status" id="status">Ожидание</div>

<!-- Блок истории коэффициентов -->
<div class="history-box" id="historyContainer">
    <span class="history-label">📊 История:</span>
    <!-- сюда будут добавляться коэффициенты -->
</div>

<div class="bet-list" id="bets">
    Ставок еще нет
</div>

<button id="betBtn">Сделать ставку ⭐</button>

<script>
document.addEventListener("DOMContentLoaded", function() {

    let time = 10;                 // секунд до старта
    let bets = [];
    let waiting = true;            // true = фаза ожидания (прием ставок), false = полёт (коэффициент растёт)
    let roundActive = false;       // чтобы не накладывать интервалы

    // История коэффициентов (максимум 5 значений)
    let historyCoeffs = [];

    const timerEl = document.getElementById("timer");
    const stickerEl = document.getElementById("sticker");
    const statusEl = document.getElementById("status");
    const betsEl = document.getElementById("bets");
    const betBtn = document.getElementById("betBtn");
    const historyContainer = document.getElementById("historyContainer");

    // Для теста — юзернейм, можно поменять
    const TelegramUser = { username: "Player" + Math.floor(Math.random()*100) };

    // Обновление списка ставок
    function updateBetsDisplay(){
        if(bets.length === 0){
            betsEl.innerHTML = "Ставок еще нет";
            return;
        }
        betsEl.innerHTML = "";
        bets.forEach(b=>{
            betsEl.innerHTML += `
                <div class="bet-item">
                    <span>@${b.username}</span>
                    <span>${b.stars} ⭐</span>
                </div>
            `;
        });
    }

    // Добавить коэффициент в историю (слева новые)
    function addHistoryCoeff(value) {
        // value — число (например 12.42)
        let formatted = value.toFixed(2);
        // Добавляем в начало массива
        historyCoeffs.unshift(formatted);
        // Оставляем только последние 5
        if (historyCoeffs.length > 5) historyCoeffs.pop();

        // Перестроить визуал
        renderHistory();
    }

    function renderHistory() {
        // Очищаем, оставляем только лейбл
        historyContainer.innerHTML = '<span class="history-label">📊 История:</span>';
        historyCoeffs.forEach(coeff => {
            const span = document.createElement('span');
            span.className = 'history-coeff';
            // если больше 10 — подсветка (условно большой коэффициент)
            if (parseFloat(coeff) >= 10.0) span.classList.add('win');
            span.textContent = `x${coeff}`;
            historyContainer.appendChild(span);
        });
        // Если история пустая, покажем плейсхолдер
        if (historyCoeffs.length === 0) {
            let emptyHint = document.createElement('span');
            emptyHint.style.opacity = '0.5';
            emptyHint.style.marginLeft = '8px';
            emptyHint.textContent = 'скоро будут';
            historyContainer.appendChild(emptyHint);
        }
    }

    // Функция ставки (доступно только в ожидании)
    function makeBet(){
        if(!waiting) {
            // попытка ставки не в окно — можно проигнорить или показать предупреждение
            statusEl.innerText = "Дождись нового раунда!";
            setTimeout(() => { if(waiting) statusEl.innerText = "Ожидание"; }, 800);
            return;
        }
        // рандом звёзд 1-50
        let stars = Math.floor(Math.random()*50)+1;
        bets.push({username: TelegramUser.username, stars: stars});
        updateBetsDisplay();
    }

    betBtn.addEventListener("click", makeBet);

    // Функция, запускающая фазу "Ожидание" (перед новым раундом)
    function startWaiting(){
        if (roundActive) {
            // если вдруг старый интервал ещё работает, но мы перезапускаем — очистим позже.
        }
        waiting = true;
        roundActive = false;  // полёт не активен
        time = 10;            // 10 секунд ожидания
        bets = [];            // сбрасываем ставки (в реальном приложении можно сохранять, но по логике новый раунд)
        updateBetsDisplay();
        statusEl.innerText = "👀 Ожидание (делайте ставки)";
        stickerEl.style.display = "none"; 
        timerEl.style.display = "block";
        timerEl.innerText = time;

        // Блокируем кнопку? нет, оставляем активной, но проверка waiting есть.
        // Запускаем обратный отсчёт
        const interval = setInterval(() => {
            if (!waiting) { 
                // если по какой-то причине вышли из ожидания раньше
                clearInterval(interval);
                return;
            }
            time--;
            timerEl.innerText = time >= 0 ? time : 0;

            if (time < 0) {
                clearInterval(interval);
                // если всё ещё в ожидании, переходим к полёту
                if (waiting) {
                    startFlight();
                }
            }
        }, 1000);
    }

    // ФАЗА ПОЛЁТА: коэффициент растет от 1.00 до 100.00
    function startFlight() {
        waiting = false;
        roundActive = true;
        // Скрываем таймер, показываем ракету/стикер
        timerEl.style.display = "none";
        stickerEl.style.display = "block";
        stickerEl.textContent = "🚀"; // заглушка вместо PN 4.webp

        // Запоминаем время старта для роста коэф.
        let coeff = 1.00;
        const flightDuration = 15000; // 15 сек расти до 100 (макс)
        const startTime = Date.now();
        const maxCoeff = 100.00;

        statusEl.innerText = "✈️ Полёт... коэффициент растёт";

        // Обновление коэффициента каждые 50 мс (плавно)
        const flightInterval = setInterval(() => {
            if (!roundActive) {
                clearInterval(flightInterval);
                return;
            }
            const elapsed = Date.now() - startTime;
            // прогресс от 0 до 1
            let progress = Math.min(elapsed / flightDuration, 1);
            // коэффициент от 1 до 100 по квадратичной функции (для интереса)
            // можно линейно: coeff = 1 + progress * 99;
            coeff = 1 + Math.pow(progress, 1.5) * 99; // небольшое ускорение к концу
            if (coeff >= maxCoeff) coeff = maxCoeff;

            // отображаем в статусе текущий коэффициент
            statusEl.innerText = `✈️ Коэффициент: x${coeff.toFixed(2)}`;

            // Если достигли максимума или прошло достаточно времени - завершаем раунд
            if (coeff >= maxCoeff || elapsed >= flightDuration + 200) {
                // раунд окончен, фиксируем коэффициент
                clearInterval(flightInterval);
                if (roundActive) {
                    endRound(coeff);
                }
            }
        }, 60);

        // Дополнительно: если никто не завершил, через 16 секунд принудительно
        setTimeout(() => {
            if (roundActive) {
                clearInterval(flightInterval);
                endRound(coeff);
            }
        }, flightDuration + 300);
    }

    // Завершение раунда, добавление истории, переход к ожиданию
    function endRound(finalCoeff) {
        if (!roundActive) return;
        roundActive = false;
        waiting = false;

        // фиксируем итоговый коэффициент (не больше 100)
        finalCoeff = Math.min(finalCoeff, 100.00);
        // Добавляем в историю
        addHistoryCoeff(finalCoeff);

        // обновляем статус
        statusEl.innerText = `🏁 Раунд окончен: x${finalCoeff.toFixed(2)}`;

        // гасим стикер, показываем "00" или просто таймер позже
        stickerEl.style.display = "none";
        timerEl.style.display = "block";
        timerEl.innerText = "0";

        // Через небольшую паузу запускаем новое ожидание
        setTimeout(() => {
            startWaiting();
        }, 2000);
    }

    // Первоначальный запуск
    startWaiting();
    renderHistory(); // пустая история при старте

    // Также имитация: в тестовых целях добавим парочку исторических коэфов (можно убрать)
    // это просто чтобы показать, как выглядит история. при желании удалить или оставить.
    setTimeout(() => {
        // добавим демо-историю (для красоты), но если хотите чистый старт, закомментируйте.
        if (historyCoeffs.length === 0) {
            addHistoryCoeff(2.13);
            addHistoryCoeff(13.42);
            addHistoryCoeff(1.63);
            addHistoryCoeff(2.28);
            addHistoryCoeff(3.48);
            // они появятся в истории сразу (до первого раунда)
        }
    }, 500);
});
</script>

</body>
</html>
