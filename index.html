<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Frog Crash</title>

<script src="/socket.io/socket.io.js"></script>

<style>
:root{
  --bg:#050607;
  --panel:#1b1b1c;
  --panel2:#242425;
  --text:#f5f5f7;
  --muted:#858589;
  --green:#38e07b;
  --red:#ff4d5e;
  --purple:#7657ff;
  --purple2:#9a80ff;
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
}

button,input{font:inherit}

#app{
  position:relative;
  width:100%;
  height:100dvh;
  overflow:hidden;
  background:
    radial-gradient(circle at 50% 50%,rgba(35,90,30,.14),transparent 25%),
    #000;
}

/* ЗВЁЗДЫ ФОНА */

#stars{
  position:absolute;
  inset:0;
  overflow:hidden;
  pointer-events:none;
}

.star{
  position:absolute;
  width:2px;
  height:2px;
  border-radius:50%;
  background:#fff;
  opacity:.2;
  animation:twinkle var(--duration) infinite ease-in-out;
}

@keyframes twinkle{
  0%,100%{opacity:.1;transform:scale(1)}
  50%{opacity:.8;transform:scale(1.5)}
}

/* HEADER */

.top{
  position:relative;
  z-index:5;
  height:72px;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:0 16px;
}

.game-title{
  display:flex;
  align-items:center;
  gap:8px;
  font-size:18px;
  font-weight:750;
}

.frog{
  width:27px;
  height:27px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#20212a;
  font-size:15px;
}

.back{
  position:absolute;
  left:16px;
  border:0;
  background:none;
  color:#fff;
  font-size:15px;
  font-weight:600;
}

.menu{
  position:absolute;
  right:16px;
  border:0;
  background:none;
  color:#fff;
  font-size:26px;
}

/* BALANCE */

.balance-bar{
  position:relative;
  z-index:5;
  display:flex;
  align-items:center;
  padding:0 14px;
}

.live{
  color:#ff5664;
  font-size:11px;
  font-weight:900;
  writing-mode:vertical-rl;
  letter-spacing:1px;
}

.balance{
  margin-left:auto;
  display:flex;
  align-items:center;
  gap:7px;
  padding:9px 15px;
  border-radius:22px;
  background:#1c1d22;
  font-size:14px;
  font-weight:750;
}

.star-icon{
  width:17px;
  height:17px;
  object-fit:contain;
}

.plus{
  width:20px;
  height:20px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#fff;
  color:#000;
  font-size:15px;
  font-weight:800;
}

/* GAME */

.game{
  position:absolute;
  z-index:2;
  left:0;
  right:0;
  top:120px;
  bottom:280px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
}

.multiplier{
  font-size:min(24vw,100px);
  line-height:1;
  font-weight:850;
  letter-spacing:-4px;
  transition:.2s;
}

.multiplier.running{color:#fff}
.multiplier.crashed{
  color:var(--red);
  transform:scale(1.04);
}

.status{
  margin-top:10px;
  color:var(--muted);
  font-size:13px;
  font-weight:650;
}

.countdown{
  color:#fff;
  font-size:18px;
  font-weight:800;
}

/* HISTORY */

.history{
  position:absolute;
  z-index:5;
  left:0;
  right:0;
  bottom:226px;
  display:flex;
  gap:8px;
  padding:0 14px 10px;
  overflow-x:auto;
  scrollbar-width:none;
}

.history::-webkit-scrollbar{display:none}

.history-item{
  flex-shrink:0;
  min-width:92px;
  padding:12px 16px;
  text-align:center;
  border-radius:14px;
  background:linear-gradient(135deg,var(--purple),var(--purple2));
  font-weight:800;
}

.history-item.low{
  background:#27282d;
  color:#a4a5ab;
}

/* BETS */

.bets{
  position:absolute;
  z-index:5;
  left:8px;
  right:8px;
  bottom:72px;
  height:150px;
  overflow:hidden;
  padding:15px;
  border-radius:20px 20px 0 0;
  background:#121314;
}

.bets-header{
  display:flex;
  justify-content:space-between;
  color:var(--muted);
  font-size:13px;
  font-weight:600;
  margin-bottom:7px;
}

.empty{
  text-align:center;
  padding:30px 10px;
  color:var(--muted);
  font-size:14px;
}

.bet{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:7px 0;
}

.bet-left{
  display:flex;
  align-items:center;
  gap:9px;
}

.avatar{
  width:34px;
  height:34px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#fff;
  font-weight:800;
}

.bet-name{
  font-size:14px;
  font-weight:700;
}

.bet-money{
  color:#ffc94d;
  font-size:12px;
  font-weight:700;
}

.bet-coef{
  color:var(--muted);
  font-weight:800;
}

.bet-coef.win{color:var(--green)}
.bet-coef.lost{color:var(--red)}

/* BOTTOM */

.bottom{
  position:absolute;
  z-index:10;
  left:0;
  right:0;
  bottom:0;
  padding:10px 14px calc(14px + env(safe-area-inset-bottom));
  background:#050607;
}

.main-button{
  width:100%;
  height:58px;
  border:0;
  border-radius:17px;
  background:#fff;
  color:#050505;
  font-size:17px;
  font-weight:850;
  transition:.15s;
}

.main-button:active{transform:scale(.98)}
.main-button.cashout{background:#38e07b}

/* MODAL */

.modal{
  position:fixed;
  z-index:100;
  inset:0;
  display:none;
  align-items:flex-end;
  background:rgba(0,0,0,.68);
  backdrop-filter:blur(8px);
}

.modal.show{display:flex}

.modal-box{
  width:100%;
  padding:28px 28px calc(28px + env(safe-area-inset-bottom));
  border-radius:30px 30px 0 0;
  background:linear-gradient(180deg,#202021,#1b1b1c);
  box-shadow:0 -10px 40px rgba(0,0,0,.45);
  animation:modalUp .22s ease-out;
}

@keyframes modalUp{
  from{transform:translateY(100%)}
  to{transform:translateY(0)}
}

.modal-title{
  position:relative;
  text-align:center;
  font-size:26px;
  font-weight:800;
  margin-bottom:40px;
}

.close{
  position:absolute;
  top:4px;
  right:0;
  width:38px;
  height:38px;
  border:0;
  border-radius:50%;
  background:none;
  color:#aaa;
  font-size:36px;
  font-weight:300;
  line-height:30px;
}

/* AMOUNT */

.amount{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:9px;
  margin-bottom:26px;
}

.amount-input{
  width:180px;
  border:0;
  outline:0;
  background:transparent;
  color:#fff;
  text-align:right;
  font-size:58px;
  font-weight:800;
  line-height:1;
}

.amount-input::-webkit-inner-spin-button,
.amount-input::-webkit-outer-spin-button{
  -webkit-appearance:none;
  margin:0;
}

.star-big{
  width:42px;
  height:42px;
  object-fit:contain;
}

/* QUICK */

.quick{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
}

.quick button{
  height:60px;
  border:0;
  border-radius:18px;
  background:#505052;
  color:#fff;
  font-size:17px;
  font-weight:650;
}

.quick button:active{transform:scale(.97)}

.min-label{
  text-align:center;
  color:#858589;
  font-size:15px;
  margin-top:17px;
}

/* AUTO */

.auto{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-top:55px;
  gap:15px;
}

.auto-left{
  display:flex;
  align-items:center;
  gap:12px;
  font-size:17px;
}

.checkbox{
  position:relative;
  width:48px;
  height:48px;
  border:3px solid #fff;
  border-radius:16px;
  cursor:pointer;
}

.checkbox.active{background:#fff}

.checkbox.active::after{
  content:"✓";
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-53%);
  color:#111;
  font-size:27px;
  font-weight:900;
}

.auto-control{
  display:flex;
  align-items:center;
  height:50px;
  border-radius:28px;
  background:#292a2c;
  overflow:hidden;
}

.auto-control button{
  width:46px;
  height:50px;
  border:0;
  background:none;
  color:#aaa;
  font-size:30px;
}

.auto-value{
  min-width:70px;
  text-align:center;
  color:#fff;
  font-size:18px;
  font-weight:700;
}

/* SEND */

.send{
  width:100%;
  height:62px;
  margin-top:30px;
  border:0;
  border-radius:21px;
  background:#fff;
  color:#080808;
  font-size:20px;
  font-weight:800;
}

.send:active{transform:scale(.98)}

/* WARNING */

.warning-title{
  margin-bottom:8px;
  font-size:27px;
  font-weight:800;
}

.warning-text{
  color:#99999d;
  font-size:18px;
  line-height:1.35;
  margin-bottom:42px;
}

.topup{
  width:100%;
  height:65px;
  border:0;
  border-radius:22px;
  background:#fff;
  color:#080808;
  font-size:20px;
  font-weight:800;
}

/* TOAST */

.toast{
  position:fixed;
  z-index:200;
  left:50%;
  bottom:90px;
  transform:translate(-50%,20px);
  opacity:0;
  pointer-events:none;
  padding:13px 20px;
  border-radius:15px;
  background:#29292b;
  color:#fff;
  font-weight:700;
  transition:.2s;
}

.toast.show{
  transform:translate(-50%,0);
  opacity:1;
}
</style>
</head>

<body>

<div id="app">

<div id="stars"></div>

<header class="top">

<button class="back" onclick="history.back()">← Назад</button>

<div class="game-title">
<span class="frog">🐸</span>
Frog Crash
</div>

<button class="menu">⋮</button>

</header>

<div class="balance-bar">

<div class="live">LIVE</div>

<div class="balance" onclick="openBetModal()">

<script>

/* =========================================================
   НАСТРОЙКИ
========================================================= */

const MIN_BET = 25;
const MIN_AUTO = 1.10;
const AUTO_STEP = 0.10;

const COUNTDOWN_SECONDS = 10;

/*
 * Раунд работает постоянно.
 * Игроки НЕ нужны для запуска.
 */

const ROUND_SPEED = 90;

/*
 * Чем больше значение, тем быстрее
 * растёт коэффициент.
 */

const CRASH_MIN = 1.10;
const CRASH_MAX = 12.00;


/* =========================================================
   СОСТОЯНИЕ
========================================================= */

let balance = 0;

let betAmount = 25;

let autoEnabled = false;

let autoMultiplier = 1.10;

let currentMultiplier = 1;

let phase = "countdown";

let currentBet = null;

let historyData = [];

let localRoundTimer = null;

let multiplierTimer = null;

let countdownTimer = null;

let socket = null;


/* =========================================================
   ELEMENTS
========================================================= */

const balanceEl =
document.getElementById("balance");

const betAmountEl =
document.getElementById("betAmount");

const autoValueEl =
document.getElementById("autoValue");

const checkboxEl =
document.getElementById("checkbox");

const multiplierEl =
document.getElementById("multiplier");

const statusEl =
document.getElementById("status");

const mainButton =
document.getElementById("mainButton");

const historyEl =
document.getElementById("history");

const betsList =
document.getElementById("betsList");


/* =========================================================
   STAR BACKGROUND
========================================================= */

const stars =
document.getElementById("stars");

for(let i=0;i<70;i++){

  const star =
  document.createElement("div");

  star.className = "star";

  star.style.left =
  Math.random()*100+"%";

  star.style.top =
  Math.random()*100+"%";

  const size =
  Math.random()*2+1;

  star.style.width =
  size+"px";

  star.style.height =
  size+"px";

  star.style.setProperty(
    "--duration",
    2+Math.random()*4+"s"
  );

  star.style.animationDelay =
  Math.random()*4+"s";

  stars.appendChild(star);
}


/* =========================================================
   BALANCE
========================================================= */

function setBalance(value){

  balance =
  Math.max(0,Number(value)||0);

  balanceEl.textContent =
  balance.toLocaleString("ru-RU");
}


/* =========================================================
   MODAL
========================================================= */

function openBetModal(){

  /*
   * Ставку можно поставить только
   * во время обратного отсчёта.
   */

  if(phase !== "countdown"){

    showToast(
      "Дождитесь следующего раунда"
    );

    return;
  }

  betAmount =
  Math.max(
    MIN_BET,
    Number(betAmount)||MIN_BET
  );

  renderBet();

  document
  .getElementById("betModal")
  .classList.add("show");
}


function closeModal(id){

  document
  .getElementById(id)
  .classList.remove("show");
}


/* =========================================================
   СУММА
========================================================= */

betAmountEl.addEventListener(
  "input",
  function(){

    let value =
    parseInt(this.value,10);

    if(isNaN(value)){
      return;
    }

    betAmount =
    Math.max(
      MIN_BET,
      value
    );
  }
);


betAmountEl.addEventListener(
  "blur",
  function(){

    let value =
    parseInt(this.value,10);

    if(
      isNaN(value) ||
      value < MIN_BET
    ){

      value = MIN_BET;
    }

    betAmount = value;

    renderBet();
  }
);


function addAmount(value){

  betAmount =
  Math.max(
    MIN_BET,
    Number(betAmount)||MIN_BET
  );

  betAmount += value;

  renderBet();
}


function renderBet(){

  betAmountEl.value =
  Math.max(
    MIN_BET,
    Number(betAmount)||MIN_BET
  );

  autoValueEl.textContent =
  autoMultiplier.toFixed(2);
}


/* =========================================================
   AUTO
========================================================= */

function toggleAuto(){

  autoEnabled =
  !autoEnabled;

  checkboxEl.classList.toggle(
    "active",
    autoEnabled
  );
}


function changeAuto(value){

  autoMultiplier += value;

  autoMultiplier =
  Math.max(
    MIN_AUTO,
    autoMultiplier
  );

  autoMultiplier =
  Number(
    autoMultiplier.toFixed(2)
  );

  renderBet();
}


/* =========================================================
   ОТПРАВКА СТАВКИ
========================================================= */

function sendBet(){

  betAmount =
  parseInt(
    betAmountEl.value,
    10
  );

  if(
    isNaN(betAmount) ||
    betAmount < MIN_BET
  ){

    betAmount =
    MIN_BET;

    renderBet();

    showToast(
      "Минимальная ставка — 25 ⭐"
    );

    return;
  }


  if(balance < betAmount){

    const missing =
    betAmount - balance;

    document.getElementById(
      "notEnoughText"
    ).textContent =
    `Нужно ещё ${missing.toLocaleString("ru-RU")} ⭐.`;

    closeModal("betModal");

    document
    .getElementById("notEnoughModal")
    .classList.add("show");

    return;
  }


  const data = {

    amount: betAmount,

    autoCashout:
    autoEnabled,

    autoMultiplier:
    autoEnabled
    ? autoMultiplier
    : null

  };


  /*
   * Если есть сервер —
   * отправляем настоящую ставку.
   */

  if(socket && socket.connected){

    socket.emit(
      "bet",
      data
    );

    return;
  }


  /*
   * Локальный режим для проверки
   * HTML без сервера.
   */

  balance -= betAmount;

  setBalance(balance);

  currentBet = {

    amount:betAmount,

    autoCashout:autoEnabled,

    autoMultiplier:
    autoEnabled
    ? autoMultiplier
    : null,

    cashedOut:false,

    lost:false
  };

  closeModal("betModal");

  showToast(
    "Ставка принята ⭐"
  );

  updateMainButton();

  renderLocalBet();
}


/* =========================================================
   LOCAL BET
========================================================= */

function renderLocalBet(){

  betsList.innerHTML = `

  <div class="bet">

    <div class="bet-left">

      <div
      class="avatar"
      style="background:#7657ff">

      P

      </div>

      <div>

        <div class="bet-name">
        Player
        </div>

        <div class="bet-money">
        ⭐ ${currentBet.amount.toLocaleString("ru-RU")}
        </div>

      </div>

    </div>

    <div class="bet-coef">
      x1.00
    </div>

  </div>

  `;
}


/* =========================================================
   CASHOUT
========================================================= */

function cashOut(){

  if(!currentBet){

    return;
  }

  if(
    socket &&
    socket.connected
  ){

    socket.emit("cashout");

    return;
  }


  if(phase !== "running"){

    showToast(
      "Раунд ещё не начался"
    );

    return;
  }


  if(currentBet.cashedOut){

    return;
  }


  currentBet.cashedOut = true;

  const win =
  Math.floor(
    currentBet.amount *
    currentMultiplier
  );

  balance += win;

  setBalance(balance);

  showToast(
    `Вывод x${currentMultiplier.toFixed(2)} · +${win.toLocaleString("ru-RU")} ⭐`
  );

  updateMainButton();

  renderLocalCashout(win);
}


function renderLocalCashout(win){

  betsList.innerHTML = `

  <div class="bet">

    <div class="bet-left">

      <div
      class="avatar"
      style="background:#7657ff">

      P

      </div>

      <div>

        <div class="bet-name">
        Player
        </div>

        <div class="bet-money">
        ⭐ ${currentBet.amount.toLocaleString("ru-RU")}
        </div>

      </div>

    </div>

    <div class="bet-coef win">
      x${currentMultiplier.toFixed(2)}
    </div>

  </div>

  `;
}


/* =========================================================
   MAIN BUTTON
========================================================= */

function updateMainButton(){

  if(
    phase === "running" &&
    currentBet &&
    !currentBet.cashedOut
  ){

    mainButton.textContent =
    `Забрать x${currentMultiplier.toFixed(2)}`;

    mainButton.classList.add(
      "cashout"
    );

    mainButton.onclick =
    cashOut;

    return;
  }


  if(phase === "countdown"){

    mainButton.textContent =
    "Сделать ставку";

    mainButton.classList.remove(
      "cashout"
    );

    mainButton.onclick =
    openBetModal;

    return;
  }


  mainButton.textContent =
  "Следующий раунд";

  mainButton.classList.remove(
    "cashout"
  );

  mainButton.onclick =
  openBetModal;
}


/* =========================================================
   ПОСТОЯННЫЙ ЦИКЛ
========================================================= */

function startPermanentGame(){

  clearInterval(localRoundTimer);

  /*
   * Первый раунд сразу начинается
   * с 10 секунд.
   */

  startCountdown();
}


/* =========================================================
   ОБРАТНЫЙ ОТСЧЁТ 10 → 1
========================================================= */

function startCountdown(){

  clearInterval(countdownTimer);
  clearInterval(multiplierTimer);

  phase =
  "countdown";

  currentMultiplier =
  1;

  multiplierEl.classList.remove(
    "running",
    "crashed"
  );

  let seconds =
  COUNTDOWN_SECONDS;

  multiplierEl.textContent =
  seconds;

  statusEl.textContent =
  "Старт через " + seconds;

  statusEl.classList.add(
    "countdown"
  );

  updateMainButton();


  countdownTimer =
  setInterval(() => {

    seconds--;

    if(seconds > 0){

      multiplierEl.textContent =
      seconds;

      statusEl.textContent =
      "Старт через " + seconds;

      return;
    }


    clearInterval(
      countdownTimer
    );

    multiplierEl.textContent =
    "x1.00";

    statusEl.textContent =
    "РАУНД НАЧАЛСЯ";

    startRound();

  },1000);
}


/* =========================================================
   СТАРТ РАУНДА
========================================================= */

function startRound(){

  clearInterval(multiplierTimer);

  phase =
  "running";

  currentMultiplier =
  1;

  multiplierEl.classList.add(
    "running"
  );

  multiplierEl.classList.remove(
    "crashed"
  );

  updateMainButton();


  /*
   * Случайная точка краша.
   * Это демонстрационный локальный режим.
   * Для настоящей игры результат должен
   * определяться сервером.
   */

  const crashAt =
  Number(
    (
      CRASH_MIN +
      Math.random() *
      (CRASH_MAX-CRASH_MIN)
    ).toFixed(2)
  );


  let startTime =
  Date.now();


  multiplierTimer =
  setInterval(() => {

    const elapsed =
    Date.now()-startTime;

    /*
     * Плавный рост коэффициента.
     */

    currentMultiplier =
    Number(
      (
        Math.pow(
          1.0008,
          elapsed
        )
      ).toFixed(2)
    );


    if(
      currentMultiplier <
      1
    ){

      currentMultiplier =
      1;
    }


    /*
     * Автовывод.
     */

    if(
      currentBet &&
      !currentBet.cashedOut &&
      currentBet.autoCashout &&
      currentMultiplier >=
      currentBet.autoMultiplier
    ){

      cashOut();
    }


    multiplierEl.textContent =
    "x" +
    currentMultiplier.toFixed(2);

    statusEl.textContent =
    "Игра идёт";

    updateMainButton();


    /*
     * КРАШ
     */

    if(
      currentMultiplier >=
      crashAt
    ){

      crashRound();

    }

  },ROUND_SPEED);
}


/* =========================================================
   КРАШ
========================================================= */

function crashRound(){

  clearInterval(
    multiplierTimer
  );

  phase =
  "crashed";

  multiplierEl.classList.remove(
    "running"
  );

  multiplierEl.classList.add(
    "crashed"
  );

  multiplierEl.textContent =
  "x" +
  currentMultiplier.toFixed(2);

  statusEl.textContent =
  "КРАШ";


  if(
    currentBet &&
    !currentBet.cashedOut
  ){

    currentBet.lost = true;

    showToast(
      "Ставка проиграла"
    );

  }


  historyData.push(
    currentMultiplier
  );

  renderHistory();


  /*
   * После короткой паузы
   * снова 10 → 1.
   */

  currentBet =
  null;

  updateMainButton();

  setTimeout(() => {

    startCountdown();

  },1800);
}


/* =========================================================
   HISTORY
========================================================= */

function renderHistory(){

  historyEl.innerHTML = "";

  historyData
  .slice(-8)
  .reverse()
  .forEach(value => {

    const item =
    document.createElement("div");

    item.className =
    "history-item";

    if(value < 2){

      item.classList.add(
        "low"
      );
    }

    item.textContent =
    "x" +
    value.toFixed(2);

    historyEl.appendChild(
      item
    );

  });
}


/* =========================================================
   TOP UP
========================================================= */

function topUp(){

  closeModal(
    "notEnoughModal"
  );

  showToast(
    "Пополнение подключается на сервере"
  );
}


/* =========================================================
   TOAST
========================================================= */

let toastTimer;

function showToast(message){

  const toast =
  document.getElementById("toast");

  toast.textContent =
  message;

  toast.classList.add(
    "show"
  );

  clearTimeout(
    toastTimer
  );

  toastTimer =
  setTimeout(() => {

    toast.classList.remove(
      "show"
    );

  },2500);
}


/* =========================================================
   SOCKET.IO
========================================================= */

function connectSocket(){

  if(typeof io !== "function"){

    /*
     * Socket.IO нет —
     * работаем полностью локально.
     */

    startPermanentGame();

    return;
  }


  try{

    socket =
    io();

  }catch(error){

    console.error(error);

    socket = null;

    startPermanentGame();

    return;
  }


  socket.on(
    "connect",
    () => {

      console.log(
        "ONLINE:",
        socket.id
      );

      let username =
      localStorage.getItem(
        "frog_username"
      );

      if(!username){

        username =
        "Player";

        localStorage.setItem(
          "frog_username",
          username
        );
      }

      socket.emit(
        "login",
        username
      );

    }
  );


  socket.on(
    "account",
    data => {

      if(
        data &&
        data.balance !== undefined
      ){

        setBalance(
          data.balance
        );
      }

    }
  );


  socket.on(
    "round:waiting",
    data => {

      /*
       * Серверный раунд имеет приоритет.
       */

      clearInterval(
        countdownTimer
      );

      phase =
      "countdown";

      const seconds =
      Number(
        data.countdown || 10
      );

      multiplierEl.textContent =
      seconds;

      statusEl.textContent =
      "Старт через " + seconds;

      updateMainButton();

    }
  );


  socket.on(
    "round:start",
    () => {

      clearInterval(
        countdownTimer
      );

      startRoundServer();

    }
  );


  socket.on(
    "round:update",
    data => {

      phase =
      "running";

      currentMultiplier =
      Number(
        data.multiplier || 1
      );

      multiplierEl.textContent =
      "x" +
      currentMultiplier.toFixed(2);

      statusEl.textContent =
      "Игра идёт";

      multiplierEl.classList.add(
        "running"
      );

      updateMainButton();

    }
  );


  socket.on(
    "round:crash",
    data => {

      clearInterval(
        multiplierTimer
      );

      phase =
      "crashed";

      currentMultiplier =
      Number(
        data.multiplier || currentMultiplier
      );

      multiplierEl.textContent =
      "x" +
      currentMultiplier.toFixed(2);

      statusEl.textContent =
      "КРАШ";

      multiplierEl.classList.remove(
        "running"
      );

      multiplierEl.classList.add(
        "crashed"
      );

      historyData.push(
        currentMultiplier
      );

      renderHistory();

      currentBet =
      null;

      updateMainButton();

    }
  );


  socket.on(
    "bet:accepted",
    data => {

      currentBet =
      data;

      closeModal(
        "betModal"
      );

      if(
        data.balance !== undefined
      ){

        setBalance(
          data.balance
        );
      }

      showToast(
        "Ставка принята ⭐"
      );

      updateMainButton();

    }
  );


  socket.on(
    "bet:error",
    message => {

      showToast(
        message
      );

    }
  );


  socket.on(
    "bets:update",
    bets => {

      renderBets(
        bets
      );

    }
  );


  socket.on(
    "cashout:success",
    data => {

      currentBet =
      null;

      if(
        data.balance !== undefined
      ){

        setBalance(
          data.balance
        );
      }

      showToast(
        `Вывод x${Number(data.multiplier).toFixed(2)} · +${Number(data.win).toLocaleString("ru-RU")} ⭐`
      );

      updateMainButton();

    }
  );


  socket.on(
    "cashout:error",
    message => {

      showToast(
        message
      );

    }
  );


  socket.on(
    "disconnect",
    () => {

      showToast(
        "Соединение потеряно"
      );

      /*
       * Если сервер отключился,
       * HTML продолжает локальный цикл,
       * поэтому игра не зависает.
       */

      if(phase !== "running"){

        startPermanentGame();

      }

    }
  );
}


/* =========================================================
   SERVER ROUND
========================================================= */

function startRoundServer(){

  clearInterval(
    multiplierTimer
  );

  phase =
  "running";

  currentMultiplier =
  1;

  multiplierEl.classList.add(
    "running"
  );

  multiplierEl.classList.remove(
    "crashed"
  );

  multiplierEl.textContent =
  "x1.00";

  statusEl.textContent =
  "Игра идёт";

  updateMainButton();
}


/* =========================================================
   BET LIST FROM SERVER
========================================================= */

function renderBets(bets){

  if(
    !bets ||
    !bets.length
  ){

    betsList.innerHTML =
    `<div class="empty">
      Раунд идёт всегда
    </div>`;

    return;
  }


  betsList.innerHTML =
  bets.map(b => {

    let state = "";

    if(b.cashedOut){
      state = "win";
    }

    if(b.lost){
      state = "lost";
    }


    return `

    <div class="bet">

      <div class="bet-left">

        <div
        class="avatar"
        style="background:${b.color || "#7657ff"}">

        ${(b.username || "U")
        .charAt(0)
        .toUpperCase()}

        </div>

        <div>

          <div class="bet-name">
          ${escapeHtml(
            b.username || "Player"
          )}
          </div>

          <div class="bet-money">
          ⭐ ${Number(
            b.amount || 0
          ).toLocaleString("ru-RU")}
          </div>

        </div>

      </div>

      <div class="bet-coef ${state}">
      x${Number(
        b.cashout ||
        b.multiplier ||
        1
      ).toFixed(2)}
      </div>

    </div>

    `;

  }).join("");
}


/* =========================================================
   ESCAPE
========================================================= */

function escapeHtml(value){

  return String(value)
  .replaceAll("&","&amp;")
  .replaceAll("<","&lt;")
  .replaceAll(">","&gt;")
  .replaceAll('"',"&quot;")
  .replaceAll("'","&#039;");
}


/* =========================================================
   BACKDROP
========================================================= */

document
.getElementById("betModal")
.addEventListener(
  "click",
  e => {

    if(e.target.id === "betModal"){

      closeModal(
        "betModal"
      );
    }

  }
);


document
.getElementById("notEnoughModal")
.addEventListener(
  "click",
  e => {

    if(
      e.target.id ===
      "notEnoughModal"
    ){

      closeModal(
        "notEnoughModal"
      );
    }

  }
);


/* =========================================================
   START
========================================================= */

setBalance(0);

renderBet();

renderHistory();

updateMainButton();

/*
 * Главное:
 * раунд НЕ ждёт игроков.
 * Он запускается автоматически:
 *
 * 10
 * 9
 * 8
 * ...
 * 2
 * 1
 * x1.00
 * ИГРА
 * КРАШ
 * снова 10...
 */

startPermanentGame();

/*
 * Socket подключается параллельно.
 */

connectSocket();

</script>
