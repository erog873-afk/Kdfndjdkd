<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Frog Case — Arena</title>

<style>
:root{
  --bg:#050507;
  --panel:#1b1a1f;
  --panel2:#242329;
  --text:#f5f5f7;
  --muted:#8e8c96;
  --green:#35d07f;
  --yellow:#ffd34d;
  --red:#ff6262;
  --blue:#4d7cff;
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
}

body{
  user-select:none;
}

#app{
  width:100%;
  height:100dvh;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

/* HEADER */

header{
  height:76px;
  padding:12px 16px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  flex-shrink:0;
}

.back{
  border:0;
  background:#111115;
  color:#fff;
  border-radius:20px;
  padding:11px 16px;
  font-size:15px;
  font-weight:700;
}

.logo{
  display:flex;
  align-items:center;
  gap:9px;
  font-size:19px;
  font-weight:800;
}

.logoIcon{
  width:38px;
  height:38px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#45c95e;
  font-size:22px;
}

.menu{
  width:42px;
  height:42px;
  border-radius:50%;
  border:0;
  background:#111115;
  color:#fff;
  font-size:25px;
}

/* TOP */

.top{
  padding:0 14px 12px;
  flex-shrink:0;
}

.topLine{
  display:flex;
  align-items:center;
  gap:8px;
}

.live{
  writing-mode:vertical-rl;
  transform:rotate(180deg);
  font-weight:900;
  font-size:13px;
  color:#fff;
  margin-right:4px;
}

.category{
  height:52px;
  min-width:52px;
  padding:0 13px;
  border-radius:18px;
  background:#222127;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:25px;
}

.balance{
  margin-left:auto;
  height:52px;
  padding:0 16px;
  border-radius:18px;
  background:#5a5960;
  display:flex;
  align-items:center;
  gap:8px;
  font-weight:800;
  font-size:17px;
}

.coin{
  font-size:22px;
}

/* TOTAL */

.total{
  margin-top:12px;
  height:72px;
  border-radius:22px;
  background:#1b1a1f;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  font-size:20px;
  font-weight:800;
}

.total span{
  color:var(--yellow);
  font-size:24px;
}

/* ARENA */

.arenaWrap{
  flex:1;
  min-height:0;
  padding:0 14px 10px;
  display:flex;
  flex-direction:column;
}

.arena{
  position:relative;
  flex:1;
  min-height:280px;
  overflow:hidden;
  border-radius:30px;
  background:
    linear-gradient(135deg,#202126,#15161a);
  border:1px solid rgba(255,255,255,.035);
}

/* GRID */

.arena:before{
  content:"";
  position:absolute;
  inset:0;
  opacity:.25;
  background-image:
    linear-gradient(rgba(255,255,255,.09) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.09) 1px,transparent 1px);
  background-size:74px 74px;
}

/* CENTER */

.center{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  text-align:center;
  z-index:10;
}

.state{
  font-size:28px;
  font-weight:900;
  white-space:nowrap;
}

.timer{
  margin-top:8px;
  font-size:16px;
  color:var(--muted);
  font-weight:700;
}

.hash{
  position:absolute;
  left:50%;
  bottom:-30px;
  transform:translateX(-50%);
  width:100%;
  text-align:center;
  color:#77757d;
  font-size:12px;
}

/* PLAYERS */

.player{
  position:absolute;
  width:70px;
  text-align:center;
  z-index:5;
  transition:
    left .5s ease,
    top .5s ease,
    transform .5s ease;
}

.avatar{
  width:56px;
  height:56px;
  margin:auto;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:25px;
  background:#33343a;
  border:3px solid rgba(255,255,255,.15);
  box-shadow:0 4px 18px rgba(0,0,0,.4);
}

.playerName{
  margin-top:5px;
  font-size:11px;
  font-weight:800;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.playerAmount{
  color:var(--yellow);
  font-size:10px;
  font-weight:800;
  margin-top:2px;
}

/* PLUS */

.plus{
  position:absolute;
  width:62px;
  height:62px;
  border-radius:50%;
  z-index:30;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#fff;
  color:#222;
  font-size:36px;
  font-weight:300;
  box-shadow:
    0 0 0 7px rgba(255,255,255,.14),
    0 0 35px rgba(255,255,255,.65);
  opacity:0;
  transform:scale(.4);
  pointer-events:none;
}

.plus.show{
  opacity:1;
  transform:scale(1);
  transition:transform .3s ease;
}

.plus.win{
  animation:winPulse .8s ease infinite alternate;
}

@keyframes winPulse{
  from{
    box-shadow:
      0 0 0 7px rgba(255,255,255,.14),
      0 0 30px rgba(255,255,255,.5);
  }
  to{
    box-shadow:
      0 0 0 13px rgba(255,255,255,.18),
      0 0 65px rgba(255,255,255,.95);
  }
}

/* WINNER */

.winnerBox{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%) scale(.8);
  z-index:50;
  background:rgba(20,20,23,.94);
  border:1px solid rgba(255,255,255,.12);
  border-radius:22px;
  padding:16px 24px;
  text-align:center;
  opacity:0;
  pointer-events:none;
  transition:.35s ease;
}

.winnerBox.show{
  opacity:1;
  transform:translate(-50%,-50%) scale(1);
}

.winnerTitle{
  font-size:13px;
  color:var(--muted);
  font-weight:700;
}

.winnerName{
  margin-top:3px;
  font-size:24px;
  font-weight:900;
}

.winnerAmount{
  color:var(--green);
  font-size:16px;
  font-weight:800;
  margin-top:3px;
}

/* PLAYERS LIST */

.playersPanel{
  margin:10px 14px 0;
  height:185px;
  flex-shrink:0;
  overflow:auto;
  border-radius:22px;
  background:var(--panel);
  padding:14px;
}

.playersHeader{
  display:flex;
  justify-content:space-between;
  color:var(--muted);
  font-weight:700;
  font-size:13px;
  margin-bottom:7px;
}

.row{
  min-height:50px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.rowLeft{
  display:flex;
  align-items:center;
  gap:10px;
}

.smallAvatar{
  width:38px;
  height:38px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#34343a;
  font-size:17px;
}

.rowName{
  font-size:14px;
  font-weight:800;
}

.rowChance{
  color:var(--muted);
  font-size:12px;
  margin-top:2px;
}

.rowBet{
  color:var(--yellow);
  font-size:15px;
  font-weight:900;
}

/* BOTTOM */

footer{
  padding:10px 14px calc(10px + env(safe-area-inset-bottom));
  flex-shrink:0;
  background:#0c0c11;
}

.betButtons{
  display:flex;
  gap:10px;
}

.betBtn{
  flex:1;
  height:58px;
  border:0;
  border-radius:19px;
  background:#fff;
  color:#111;
  font-size:16px;
  font-weight:900;
}

.betBtn:active{
  transform:scale(.97);
}

.custom{
  width:58px;
  height:58px;
  border:0;
  border-radius:19px;
  background:#3b3a40;
  color:#fff;
  font-size:30px;
}

/* TOAST */

.toast{
  position:fixed;
  left:50%;
  bottom:90px;
  transform:translate(-50%,20px);
  z-index:100;
  padding:12px 18px;
  background:#fff;
  color:#111;
  border-radius:14px;
  font-weight:800;
  opacity:0;
  pointer-events:none;
  transition:.25s;
}

.toast.show{
  opacity:1;
  transform:translate(-50%,0);
}
</style>
</head>

<body>

<div id="app">

<header>
  <button class="back">‹&nbsp; Назад</button>

  <div class="logo">
    <div class="logoIcon">🐸</div>
    Frog Case
  </div>

  <button class="menu">⋮</button>
</header>

<div class="top">

  <div class="topLine">

    <div class="live">LIVE</div>

    <div class="category">🍪</div>
    <div class="category">🍓</div>
    <div class="category">🪄</div>

    <div class="balance">
      <span class="coin">⭐</span>
      <span id="balance">160</span>
    </div>

  </div>

  <div class="total">
    Всего <span>⭐ <b id="total">0</b></span>
  </div>

</div>

<div class="arenaWrap">

  <div class="arena" id="arena">

    <div class="center" id="center">
      <div class="state" id="state">Ожидание игроков</div>
      <div class="timer" id="timer">Новый раунд через 10</div>
    </div>

    <div class="plus" id="plus">+</div>

    <div class="winnerBox" id="winnerBox">
      <div class="winnerTitle">ПОБЕДИТЕЛЬ</div>
      <div class="winnerName" id="winnerName">—</div>
      <div class="winnerAmount" id="winnerAmount">⭐ 0</div>
    </div>

  </div>

  <div class="hash">
    Хэш игры: <span id="hash">генерация...</span>
  </div>

</div>

<div class="playersPanel">

  <div class="playersHeader">
    <span>Игроки</span>
    <span id="gameNumber">Игра #272200</span>
  </div>

  <div id="playersList"></div>

</div>

<footer>

  <div class="betButtons">

    <button class="betBtn" data-bet="100">⭐ 100</button>
    <button class="betBtn" data-bet="500">⭐ 500</button>
    <button class="betBtn" data-bet="1000">⭐ 1000</button>
    <button class="custom" id="customBet">+</button>

  </div>

</footer>

<div class="toast" id="toast"></div>

<script>
/* =========================================================
   ARENA
   ========================================================= */

const stateEl       = document.getElementById("state");
const timerEl       = document.getElementById("timer");
const totalEl       = document.getElementById("total");
const balanceEl     = document.getElementById("balance");
const playersList   = document.getElementById("playersList");
const arena         = document.getElementById("arena");
const plus          = document.getElementById("plus");
const hashEl        = document.getElementById("hash");
const winnerBox     = document.getElementById("winnerBox");
const winnerNameEl  = document.getElementById("winnerName");
const winnerAmountEl= document.getElementById("winnerAmount");
const gameNumberEl  = document.getElementById("gameNumber");
const toast         = document.getElementById("toast");

let balance = 160;
let gameNumber = 272200;

let players = [];

let phase = "countdown";

let countdown = 10;

let serverSeed = "";
let serverHash = "";

let winner = null;

let countdownInterval = null;
let botInterval = null;


/* =========================================================
   УТИЛИТЫ
   ========================================================= */

function randomHex(bytes = 32){

  const data = new Uint8Array(bytes);

  crypto.getRandomValues(data);

  return [...data]
    .map(x => x.toString(16).padStart(2,"0"))
    .join("");
}


async function sha256(text){

  const data = new TextEncoder().encode(text);

  const hashBuffer = await crypto.subtle.digest(
    "SHA-256",
    data
  );

  return [...new Uint8Array(hashBuffer)]
    .map(x => x.toString(16).padStart(2,"0"))
    .join("");
}


function money(value){

  return Number(value).toLocaleString("ru-RU");
}


function showToast(text){

  toast.textContent = text;

  toast.classList.add("show");

  setTimeout(()=>{
    toast.classList.remove("show");
  },1800);
}


/* =========================================================
   НОВЫЙ РАУНД
   ========================================================= */

async function createRound(){

  phase = "countdown";

  countdown = 10;

  winner = null;

  players = [];

  plus.classList.remove("show","win");

  winnerBox.classList.remove("show");

  gameNumber++;

  gameNumberEl.textContent = "Игра #" + gameNumber;

  /*
     ВАЖНО:

     Сначала создаём секрет раунда.
     Потом публикуем только его SHA-256.

     Ставки не могут менять этот hash.
  */

  serverSeed = randomHex(32);

  serverHash = await sha256(serverSeed);

  hashEl.textContent =
    serverHash.slice(0,4) +
    "..." +
    serverHash.slice(-4);

  renderPlayers();

  stateEl.textContent = "Ожидание игроков";

  timerEl.textContent =
    "Новый раунд через " + countdown;

  startCountdown();
}


/* =========================================================
   ТАЙМЕР
   ========================================================= */

function startCountdown(){

  clearInterval(countdownInterval);

  countdownInterval = setInterval(()=>{

    countdown--;

    timerEl.textContent =
      "Новый раунд через " + countdown;

    if(countdown <= 0){

      clearInterval(countdownInterval);

      startArena();

    }

  },1000);

}


/* =========================================================
   СТАРТ ARENA
   ========================================================= */

function startArena(){

  phase = "running";

  stateEl.textContent = "Выбор победителя";

  timerEl.textContent = "Ставки закрыты";

  clearInterval(botInterval);

  /*
     В демо можно добавить ботов.
     Они появляются только во время ожидания.
  */

  if(players.length > 0){

    setTimeout(selectWinner,1200);

  }else{

    /*
       Даже без игроков раунд НЕ зависает.
       Он завершается и сразу создаётся новый.
    */

    setTimeout(()=>{

      stateEl.textContent = "Нет игроков";

      timerEl.textContent = "Новый раунд";

      setTimeout(createRound,1500);

    },1000);
  }
}


/* =========================================================
   ЧЕСТНЫЙ ВЫБОР ПО ХЭШУ
   ========================================================= */

async function selectWinner(){

  if(players.length === 0){

    setTimeout(createRound,1000);

    return;
  }

  /*
     Берём опубликованный до ставок serverHash.

     Веса игроков = размер ставки.

     Например:

     Игрок A = 100
     Игрок B = 200
     Игрок C = 700

     Всего = 1000

     Шансы:

     A = 10%
     B = 20%
     C = 70%

     Случайное число из hash выбирает один
     диапазон.

     Сумма ставок НЕ заставляет конкретного
     игрока проиграть.
  */

  const total = players.reduce(
    (sum,p)=>sum + p.amount,
    0
  );

  const resultHash = await sha256(
    serverSeed + ":" + gameNumber
  );

  /*
     Используем первые 8 hex-символов
     как число.
  */

  const randomNumber =
    parseInt(resultHash.slice(0,8),16);

  const randomValue =
    randomNumber / 0xffffffff;

  const target =
    randomValue * total;

  let current = 0;

  let selected = null;

  for(const player of players){

    current += player.amount;

    if(target < current){

      selected = player;

      break;
    }
  }

  if(!selected){

    selected = players[players.length-1];
  }

  winner = selected;

  await animatePlus(selected);

}


/* =========================================================
   АНИМАЦИЯ ПЛЮСА
   ========================================================= */

async function animatePlus(selected){

  stateEl.textContent = "Определяем победителя";

  timerEl.textContent = "🎯";

  const positions = [];

  document.querySelectorAll(".player").forEach(el=>{

    const rect = el.getBoundingClientRect();

    const arenaRect =
      arena.getBoundingClientRect();

    positions.push({

      x:
        rect.left -
        arenaRect.left +
        rect.width/2 -
        31,

      y:
        rect.top -
        arenaRect.top +
        rect.height/2 -
        31

    });

  });

  /*
     Несколько проходов по игрокам,
     чтобы визуально было видно движение +.
  */

  for(let round=0; round<2; round++){

    for(let i=0;i<positions.length;i++){

      plus.style.left = positions[i].x + "px";
      plus.style.top  = positions[i].y + "px";

      plus.classList.add("show");

      await sleep(300);

    }
  }

  const selectedEl =
    document.querySelector(
      `.player[data-id="${selected.id}"]`
    );

  if(selectedEl){

    const rect =
      selectedEl.getBoundingClientRect();

    const arenaRect =
      arena.getBoundingClientRect();

    plus.style.left =
      (
        rect.left -
        arenaRect.left +
        rect.width/2 -
        31
      ) + "px";

    plus.style.top =
      (
        rect.top -
        arenaRect.top +
        rect.height/2 -
        31
      ) + "px";
  }

  plus.classList.add("win");

  stateEl.textContent = "Победитель";

  timerEl.textContent =
    selected.name;

  /*
     Выплата.

     В этой демонстрационной версии
     весь общий банк передаётся победителю.
  */

  balance += totalAmount();

  updateBalance();

  winnerNameEl.textContent =
    selected.name;

  winnerAmountEl.textContent =
    "⭐ " + money(totalAmount());

  winnerBox.classList.add("show");

  /*
     Показываем раскрытый секрет после результата.
     Так можно проверить:

     SHA-256(serverSeed) == hash,
     который был показан до ставок.
  */

  setTimeout(()=>{

    hashEl.textContent =
      serverHash.slice(0,4) +
      "..." +
      serverHash.slice(-4);

  },500);

  setTimeout(()=>{

    createRound();

  },3500);

}


/* =========================================================
   СТАВКА
   ========================================================= */

function placeBet(amount){

  if(phase !== "countdown"){

    showToast("Ставки уже закрыты");

    return;
  }

  if(balance < amount){

    showToast("Недостаточно ⭐");

    return;
  }

  balance -= amount;

  updateBalance();

  /*
     В реальном онлайн-проекте здесь ставка
     должна отправляться на сервер.
  */

  players.push({

    id:
      Date.now() +
      Math.random(),

    name:"Вы",

    amount:amount,

    avatar:"🐸",

    color:"#35d07f"

  });

  renderPlayers();

  showToast(
    "Ставка ⭐ " + money(amount) + " принята"
  );
}


/* =========================================================
   БОТЫ
   ========================================================= */

const botNames = [
  "dessq",
  "angelina",
  "BОВВУ",
  "VelyOrion",
  "Слава",
  "Kürşat",
  "Азиз"
];

const botAvatars = [
  "🐱",
  "🦊",
  "🐸",
  "🐼",
  "🐰",
  "🐻",
  "👽"
];

function addBot(){

  if(phase !== "countdown") return;

  /*
     Небольшие демонстрационные боты.
     Их можно полностью удалить для
     реального режима.
  */

  if(Math.random() > .42) return;

  if(players.length >= 7) return;

  const amounts = [
    25,
    50,
    100,
    200
  ];

  const amount =
    amounts[
      Math.floor(
        Math.random()*amounts.length
      )
    ];

  players.push({

    id:
      Date.now() +
      Math.random(),

    name:
      botNames[
        Math.floor(
          Math.random()*botNames.length
        )
      ],

    amount,

    avatar:
      botAvatars[
        Math.floor(
          Math.random()*botAvatars.length
        )
      ]

  });

  renderPlayers();

}


/* =========================================================
   РЕНДЕР ИГРОКОВ
   ========================================================= */

function renderPlayers(){

  totalEl.textContent =
    money(totalAmount());

  playersList.innerHTML = "";

  players.forEach((player,index)=>{

    const chance =
      totalAmount() > 0
        ? player.amount /
          totalAmount() *
          100
        : 0;

    const row =
      document.createElement("div");

    row.className = "row";

    row.innerHTML = `

      <div class="rowLeft">

        <div class="smallAvatar">
          ${player.avatar}
        </div>

        <div>

          <div class="rowName">
            ${escapeHTML(player.name)}
          </div>

          <div class="rowChance">
            Шанс ${chance.toFixed(2)}%
          </div>

        </div>

      </div>

      <div class="rowBet">
        ⭐ ${money(player.amount)}
      </div>

    `;

    playersList.appendChild(row);

  });

  renderArenaPlayers();

}


/* =========================================================
   ИГРОКИ В КВАДРАТЕ
   ========================================================= */

function renderArenaPlayers(){

  document
    .querySelectorAll(".player")
    .forEach(el=>el.remove());

  const count = players.length;

  if(count === 0) return;

  players.forEach((player,index)=>{

    const el =
      document.createElement("div");

    el.className = "player";

    el.dataset.id = player.id;

    el.innerHTML = `

      <div class="avatar">
        ${player.avatar}
      </div>

      <div class="playerName">
        ${escapeHTML(player.name)}
      </div>

      <div class="playerAmount">
        ⭐ ${money(player.amount)}
      </div>

    `;

    /*
       Расставляем игроков по квадрату
       в разных местах.
    */

    const positions = [

      [12,15],
      [72,12],
      [15,68],
      [72,70],
      [42,15],
      [42,72],
      [10,42]

    ];

    const pos =
      positions[index % positions.length];

    el.style.left = pos[0] + "%";
    el.style.top  = pos[1] + "%";

    arena.appendChild(el);

  });

}


/* =========================================================
   ОБЩАЯ СУММА
   ========================================================= */

function totalAmount(){

  return players.reduce(
    (sum,p)=>sum + Number(p.amount),
    0
  );

}


/* =========================================================
   БАЛАНС
   ========================================================= */

function updateBalance(){

  balanceEl.textContent =
    money(balance);

}


/* =========================================================
   ESCAPE
   ========================================================= */

function escapeHTML(value){

  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


/* =========================================================
   SLEEP
   ========================================================= */

function sleep(ms){

  return new Promise(
    resolve=>setTimeout(resolve,ms)
  );

}


/* =========================================================
   КНОПКИ СТАВОК
   ========================================================= */

document
  .querySelectorAll(".betBtn")
  .forEach(button=>{

    button.addEventListener("click",()=>{

      const amount =
        Number(button.dataset.bet);

      placeBet(amount);

    });

  });


/* =========================================================
   СВОЯ СТАВКА
   ========================================================= */

document
  .getElementById("customBet")
  .addEventListener("click",()=>{

    const value =
      prompt("Введите количество ⭐");

    if(value === null) return;

    const amount =
      Number(value);

    if(
      !Number.isFinite(amount) ||
      amount <= 0
    ){

      showToast("Введите правильную сумму");

      return;
    }

    placeBet(
      Math.floor(amount)
    );

  });


/* =========================================================
   БОТЫ ЗАПУСКАЮТСЯ ВСЕГДА
   ========================================================= */

function startBots(){

  clearInterval(botInterval);

  botInterval = setInterval(()=>{

    if(phase === "countdown"){

      addBot();

    }

  },850);

}


/* =========================================================
   ЗАПУСК
   ========================================================= */

updateBalance();

startBots();

/*
   Раунд запускается ВСЕГДА.

   Есть игроки → принимаем ставки →
   выбираем победителя.

   Нет игроков → раунд всё равно
   заканчивается → новый раунд.
*/

createRound();

</script>
