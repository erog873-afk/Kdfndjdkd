<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aviator — 5 ставок + счётчик</title>
    <style>
        body {
            margin: 0;
            background: #0b1422;
            color: white;
            font-family: Arial, sans-serif;
        }

        .balance-bar {
            position: fixed;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.1);
            padding: 8px 16px;
            border-radius: 25px;
            display: flex;
            align-items: center;
            gap: 10px;
            backdrop-filter: blur(8px);
            z-index: 1000;
        }

        .balance-value {
            font-size: 20px;
            font-weight: 600;
        }

        .add-btn {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            border: none;
            background: #2f7cff;
            color: white;
            font-size: 18px;
            cursor: pointer;
        }

        .timer-container {
            width: 100%;
            margin-top: 100px;
            text-align: center;
            position: relative;
        }

        .timer {
            font-size: 90px;
            height: 200px;
            line-height: 200px;
            font-weight: bold;
        }

        .plane {
            display: none;
            width: 100%;
            height: 200px;
            object-fit: contain;
        }

        .bottom-bar {
            display: flex;
            gap: 10px;
            padding: 12px;
            overflow-x: auto;
        }

        .bottom-item {
            padding: 10px 22px;
            border-radius: 25px;
            font-weight: 700;
            background: #1e2a47;
            color: #c8d4ea;
        }

        .bottom-item.active {
            background: white;
            color: black;
        }

        .bet-list {
            position: relative;
            width: 90%;
            margin: 20px auto;
            padding: 40px 20px 20px 20px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            min-height: 260px;
            display: flex;
            flex-direction: column;
        }

        .bet-title-left {
            position: absolute;
            top: 15px;
            left: 20px;
            font-weight: bold;
            font-size: 14px;
            color: #a0b5d9;
            display: block;
        }

        .bet-title-right {
            position: absolute;
            top: 15px;
            right: 20px;
            font-weight: bold;
            font-size: 14px;
            color: #a0b5d9;
            display: block;
        }

        #betsContainer {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 10px;
            min-height: 160px;
        }

        .bet-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            background: rgba(30, 45, 70, 0.6);
            border-radius: 12px;
            border-left: 4px solid transparent;
        }

        .bet-row.player-row {
            background: rgba(47, 124, 255, 0.25);
            border-left: 4px solid #2f7cff;
        }

        .left-block {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .player-name {
            font-weight: 700;
            color: white;
            min-width: 70px;
        }

        .stars-block {
            display: flex;
            align-items: baseline;
            gap: 5px;
        }
        .star-icon {
            color: #ffd966;
            font-size: 18px;
        }
        .stars-amount {
            color: #ffd966;
            font-weight: 800;
            font-size: 18px;
        }
        .multiplier-x {
            color: white;
            font-size: 16px;
            margin-left: 4px;
            opacity: 0.8;
        }
        .multiplier-value {
            color: #b3e0ff;
            font-size: 16px;
            font-weight: 600;
        }

        .right-star {
            color: #ffd966;
            font-size: 28px;
            line-height: 1;
            opacity: 0.9;
        }

        .more-bets {
            text-align: center;
            margin-top: 15px;
            padding: 10px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 30px;
            color: #b6ccff;
            font-weight: 600;
            font-size: 15px;
            border: 1px solid #3a5590;
        }

        .main-btn {
            position: fixed;
            bottom: 20px;
            left: 5%;
            width: 90%;
            height: 60px;
            border: none;
            border-radius: 15px;
            font-size: 20px;
            background: #2f7cff;
            color: white;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="balance-bar">
    <span class="balance-value">⭐0</span>
    <button class="add-btn" id="addBalance">+</button>
</div>

<div class="timer-container">
    <div class="timer" id="timer"></div>
    <img id="planeImage" class="plane" src="PN4.webp" />
    <div class="bottom-bar" id="bottomBar"></div>
</div>

<div class="bet-list">
    <div class="bet-title-left">Ставка</div>
    <div class="bet-title-right">Возможн. приз</div>
    <div id="betsContainer"></div>
    <div id="moreBets" class="more-bets" style="display: none;"></div>
</div>

<button class="main-btn" id="betBtn">Сделать ставку ⭐50</button>

<script>
document.addEventListener("DOMContentLoaded", function() {
    let balance = localStorage.getItem("balance") 
        ? parseInt(localStorage.getItem("balance")) 
        : 1000;

    const balanceEl = document.querySelector(".balance-value");
    const addBalanceBtn = document.getElementById("addBalance");
    const timerEl = document.getElementById("timer");
    const imageEl = document.getElementById("planeImage");
    const bottomBar = document.getElementById("bottomBar");
    const betsContainer = document.getElementById("betsContainer");
    const moreBetsEl = document.getElementById("moreBets");
    const betBtn = document.getElementById("betBtn");

    balanceEl.innerText = "⭐" + balance;

    function saveBalance() {
        localStorage.setItem("balance", balance);
        balanceEl.innerText = "⭐" + balance;
    }

    addBalanceBtn.addEventListener("click", () => {
        balance += 100;
        saveBalance();
    });

    // Состояние
    let time = 10;
    let waiting = true;
    let currentMultiplier = 1.00;
    let history = [];
    let growthInterval;

    // Игрок
    let playerBet = {
        name: "Вы",
        stars: 0,
        multiplier: 1.00,
        isPlayer: true
    };

    // Боты
    let botNames = ["soles_mm37", "mr797n", "crypto_king", "lucky77", "flyhigh", "bet_master", "skywalker", "aviator_pro", "moon_shot", "rich_pilot"];
    
    function generateBotBets(count) {
        let bots = [];
        for (let i = 0; i < count; i++) {
            let name = botNames[i % botNames.length];
            let uniqueName = name;
            if (i >= botNames.length) {
                uniqueName = name + "_" + (Math.floor(i / botNames.length) + 1);
            }
            bots.push({
                name: uniqueName,
                stars: Math.floor(Math.random() * 300) + 20, // 20-320
                multiplier: 1.00,
                isPlayer: false
            });
        }
        return bots;
    }

    let botBets = generateBotBets(8); // 8 ботов чтобы было "и ещё ставок"

    // Полный список активных ставок
    function getActiveBets() {
        let active = [];
        if (playerBet.stars > 0) {
            active.push({...playerBet});
        }
        botBets.forEach(b => {
            if (b.stars > 0) {
                active.push({...b});
            }
        });
        return active;
    }

    // Сортировка: сначала игрок, потом боты по убыванию звёзд
    function getSortedBets() {
        let active = getActiveBets();
        let player = active.find(b => b.isPlayer);
        let bots = active.filter(b => !b.isPlayer).sort((a, b) => b.stars - a.stars);
        
        if (player) {
            return [player, ...bots];
        }
        return bots;
    }

    // Обновление отображения ставок
    function updateBetsDisplay() {
        let sorted = getSortedBets();
        
        if (sorted.length === 0) {
            betsContainer.innerHTML = '<div style="text-align:center; padding:30px; color:#8899cc;">Ставок еще нет</div>';
            moreBetsEl.style.display = "none";
            return;
        }

        // Показываем максимум 5 ставок
        let visibleBets = sorted.slice(0, 5);
        let remainingCount = sorted.length - 5;

        betsContainer.innerHTML = "";
        visibleBets.forEach(bet => {
            let row = document.createElement("div");
            row.className = "bet-row" + (bet.isPlayer ? " player-row" : "");
            
            // Текущие звёзды (начальная ставка * множитель)
            let currentStars = Math.floor(bet.stars * currentMultiplier);
            if (currentStars < bet.stars) currentStars = bet.stars; // минимум начальная ставка

            row.innerHTML = `
                <div class="left-block">
                    <span class="player-name">${bet.name}</span>
                    <div class="stars-block">
                        <span class="star-icon">⭐</span>
                        <span class="stars-amount">${currentStars}</span>
                        <span class="multiplier-x">x</span>
                        <span class="multiplier-value">${currentMultiplier.toFixed(2)}</span>
                    </div>
                </div>
                <div class="right-star">⭐</div>
            `;
            betsContainer.appendChild(row);
        });

        if (remainingCount > 0) {
            moreBetsEl.style.display = "block";
            moreBetsEl.innerText = `и ещё ставок: ${remainingCount}`;
        } else {
            moreBetsEl.style.display = "none";
        }
    }

    betBtn.addEventListener("click", () => {
        if (!waiting) {
            alert("Сейчас идёт игра, дождитесь нового раунда");
            return;
        }

        let betAmount = 50;

        if (balance < betAmount) {
            alert("Недостаточно звёзд ⭐");
            return;
        }

        balance -= betAmount;
        saveBalance();

        playerBet.stars = betAmount;
        playerBet.multiplier = 1.00;

        updateBetsDisplay();
    });

    function renderBottom(activeText = null) {
        bottomBar.innerHTML = "";
        if (activeText) {
            bottomBar.innerHTML += `<div class="bottom-item active">${activeText}</div>`;
        }
        history.forEach(h => {
            bottomBar.innerHTML += `<div class="bottom-item">${h}</div>`;
        });
    }

    function startWaiting() {
        waiting = true;
        time = 10;
        
        // Сбрасываем ставки для нового раунда
        playerBet.stars = 0;
        botBets = generateBotBets(8); // новые боты
        
        updateBetsDisplay();

        timerEl.innerText = time;
        imageEl.style.display = "none";
        timerEl.style.display = "block";

        renderBottom("Ожидание");

        const interval = setInterval(() => {
            time--;
            if (time <= 0) {
                clearInterval(interval);
                startRound();
                return;
            }
            timerEl.innerText = time;
        }, 1000);
    }

    function startRound() {
        waiting = false;
        currentMultiplier = 1.00;

        timerEl.style.display = "none";
        imageEl.style.display = "block";
        imageEl.src = "PN4.webp";

        let hasBets = playerBet.stars > 0 || botBets.some(b => b.stars > 0);
        
        if (hasBets) {
            growthInterval = setInterval(() => {
                currentMultiplier += 0.03;
                updateBetsDisplay();
                renderBottom("x" + currentMultiplier.toFixed(2));

                if (currentMultiplier >= 5 + Math.random() * 15) {
                    clearInterval(growthInterval);
                    let crashValue = currentMultiplier.toFixed(2);
                    history.unshift("x" + crashValue);
                    if (history.length > 10) history.pop();
                    imageEl.src = "crash.webp";
                    setTimeout(() => {
                        startWaiting();
                    }, 1500);
                }
            }, 50);
        } else {
            growthInterval = setInterval(() => {
                currentMultiplier += 0.03;
                renderBottom("x" + currentMultiplier.toFixed(2));

                if (currentMultiplier >= 5 + Math.random() * 15) {
                    clearInterval(growthInterval);
                    let crashValue = currentMultiplier.toFixed(2);
                    history.unshift("x" + crashValue);
                    if (history.length > 10) history.pop();
                    imageEl.src = "crash.webp";
                    setTimeout(() => {
                        startWaiting();
                    }, 1500);
                }
            }, 50);
        }
    }

    startWaiting();
});
</script>
</body>
</html>
