<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <title>Game Mini App</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root{
      --bg:#18191d;
      --panel:#202126;
      --panel2:#2c2d32;
      --muted:#7e8088;
      --text:#f2f3f5;
      --accent:#2f6df6;
      --accent2:#3f7cff;
      --line:#35363c;
      --green:#39d98a;
      --yellow:#ffb72e;
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,Arial,sans-serif}
    body{padding:0 0 env(safe-area-inset-bottom)}
    button{font:inherit;color:inherit;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
    .app{max-width:760px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
    .top{padding:18px 16px 0}
    .difficulty{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px;background:#303136;border-radius:30px;padding:4px}
    .difficulty button{height:62px;border-radius:27px;background:transparent;color:#8c8e95;font-weight:700;font-size:20px}
    .difficulty button.active{background:#55565a;color:#fff;box-shadow:0 1px 0 rgba(255,255,255,.05) inset}
    .nav{display:flex;justify-content:center;gap:58px;padding:28px 0 16px;color:#73757d;font-size:18px;font-weight:650}
    .nav button{background:transparent;color:#73757d}
    .nav button.active{color:#a9abb1}
    .game-area{flex:1;min-height:410px;padding:18px 16px 10px;display:flex;align-items:center;justify-content:center}
    .game-card{width:100%;min-height:340px;border:1px solid #292a30;border-radius:28px;background:linear-gradient(180deg,#1c1d21,#191a1e);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px;position:relative;overflow:hidden}
    .game-title{font-size:22px;font-weight:800;margin-bottom:8px}
    .game-sub{color:#777982;text-align:center;max-width:390px;line-height:1.4;margin-bottom:28px}
    .target{width:128px;height:128px;border-radius:50%;background:#34353a;display:grid;place-items:center;font-size:40px;font-weight:800;transition:.18s;box-shadow:0 0 0 0 rgba(57,217,138,0)}
    .target.ready{background:var(--green);box-shadow:0 0 0 14px rgba(57,217,138,.09);transform:scale(1.04)}
    .target.fail{background:#e85b66}
    .status{height:28px;margin-top:22px;color:#858790;font-size:15px}
    .balance{margin:0 16px 14px;border:1px solid #3a3b40;background:#191a1e;border-radius:28px;min-height:118px;padding:18px;display:flex;align-items:center;justify-content:space-between;gap:14px}
    .balance-left{display:flex;align-items:center;gap:12px;min-width:0}
    .star{font-size:38px;filter:drop-shadow(0 2px 2px rgba(0,0,0,.25))}
    .amount{font-size:28px;font-weight:750}
    .stake-row{display:flex;gap:10px}
    .stake{background:#535458;border-radius:26px;padding:17px 26px;font-weight:750;font-size:18px;min-width:120px}
    .stake.selected{background:#68696d}
    .send{margin:0 16px 18px;width:calc(100% - 32px);height:86px;border-radius:34px;background:var(--accent);font-size:27px;font-weight:750;box-shadow:0 7px 20px rgba(47,109,246,.15)}
    .send:active{transform:translateY(1px);background:var(--accent2)}
    .send:disabled{opacity:.45}
    .toast{position:fixed;left:50%;bottom:120px;transform:translate(-50%,20px);opacity:0;background:#34353a;border:1px solid #47484e;padding:12px 18px;border-radius:18px;color:#fff;transition:.2s;pointer-events:none;white-space:nowrap}
    .toast.show{opacity:1;transform:translate(-50%,0)}
    .modal{position:fixed;inset:0;background:rgba(0,0,0,.58);display:none;align-items:flex-end;justify-content:center}
    .modal.show{display:flex}
    .sheet{width:min(760px,100%);background:#24252a;border-radius:28px 28px 0 0;padding:24px 20px calc(24px + env(safe-area-inset-bottom));line-height:1.5}
    .sheet h2{margin:0 0 12px}.sheet p{color:#a1a3aa;margin:8px 0}.close{margin-top:18px;width:100%;height:52px;border-radius:18px;background:#3b3c42}
    @media (max-width:560px){
      .difficulty button{font-size:17px;height:58px}
      .nav{gap:42px;font-size:16px}
      .balance{min-height:108px}
      .stake{padding:15px 18px;min-width:104px}
      .game-area{min-height:390px}
    }
  </style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="difficulty" role="tablist">
      <button data-level="easy" class="active">Легко</button>
      <button data-level="medium">Средне</button>
      <button data-level="hard">Сложно</button>
    </div>
    <div class="nav">
      <button id="aboutBtn">Об игре</button>
      <button id="fairBtn">Честная игра</button>
    </div>
  </header>

  <main class="game-area">
    <section class="game-card">
      <div class="game-title" id="gameTitle">Поймай зелёный</div>
      <div class="game-sub" id="gameSub">Нажми «Отправить», дождись зелёного сигнала и коснись круга.</div>
      <button class="target" id="target" disabled>★</button>
      <div class="status" id="status">Сделай ставку и начни раунд</div>
    </section>
  </main>

  <section class="balance">
    <div class="balance-left">
      <div class="star">⭐</div>
      <div class="amount" id="balance">25</div>
    </div>
    <div class="stake-row">
      <button class="stake selected" data-stake="100">+100</button>
      <button class="stake" data-stake="500">+500</button>
    </div>
  </section>

  <button class="send" id="sendBtn">Отправить</button>
</div>

<div class="toast" id="toast"></div>

<div class="modal" id="modal">
  <div class="sheet">
    <h2 id="modalTitle"></h2>
    <p id="modalText"></p>
    <button class="close" id="closeModal">Закрыть</button>
  </div>
</div>

<script>
(() => {
  const tg = window.Telegram?.WebApp;
  if (tg) {
    tg.ready();
    tg.expand();
    if (tg.setHeaderColor) tg.setHeaderColor('#18191d');
    if (tg.setBackgroundColor) tg.setBackgroundColor('#18191d');
  }

  const $ = s => document.querySelector(s);
  const $$ = s => [...document.querySelectorAll(s)];

  let balance = Number(localStorage.getItem('demo_balance') || 10000);
  let stake = 100;
  let level = 'easy';
  let timer = null;
  let readyAt = 0;
  let running = false;

  const levels = {
    easy:   { title:'Поймай зелёный', delay:[1200,2200], window:1100 },
    medium: { title:'Поймай зелёный', delay:[900,1800],  window:750 },
    hard:   { title:'Поймай зелёный', delay:[500,1300],  window:500 }
  };

  function renderBalance(){ $('#balance').textContent = balance.toLocaleString('ru-RU'); }
  function toast(msg){
    const el=$('#toast'); el.textContent=msg; el.classList.add('show');
    setTimeout(()=>el.classList.remove('show'),1800);
  }
  function rand(a,b){return Math.floor(Math.random()*(b-a+1))+a}

  $$('.difficulty button').forEach(btn => btn.addEventListener('click', () => {
    $$('.difficulty button').forEach(x=>x.classList.remove('active'));
    btn.classList.add('active');
    level=btn.dataset.level;
    $('#status').textContent='Сложность изменена';
    $('#gameSub').textContent =
      level==='easy' ? 'Простое окно реакции — попробуй поймать зелёный сигнал.' :
      level==='medium' ? 'Окно реакции короче. Следи за кругом.' :
      'Быстрый режим. Нужна точная реакция.';
  }));

  $$('.stake').forEach(btn => btn.addEventListener('click',()=>{
    $$('.stake').forEach(x=>x.classList.remove('selected'));
    btn.classList.add('selected');
    stake=Number(btn.dataset.stake);
  }));

  $('#sendBtn').addEventListener('click', startRound);

  $('#target').addEventListener('click',()=>{
    if(!running || !readyAt) return;
    const elapsed=Date.now()-readyAt;
    clearTimeout(timer);
    running=false;
    $('#target').disabled=true;
    if(elapsed <= levels[level].window){
      const reward=stake*2;
      balance += reward;
      $('#status').textContent=`Успех! +${reward.toLocaleString('ru-RU')} ⭐`;
      toast(`Раунд выигран: +${reward} ⭐`);
    } else {
      $('#status').textContent='Поздно — попробуй ещё раз';
      toast('Сигнал был упущен');
    }
    localStorage.setItem('demo_balance',balance);
    renderBalance();
  });

  function startRound(){
    if(running) return;
    if(balance < stake){
      toast('Недостаточно ⭐');
      return;
    }
    balance -= stake;
    localStorage.setItem('demo_balance',balance);
    renderBalance();

    running=true; readyAt=0;
    $('#sendBtn').disabled=true;
    $('#target').disabled=true;
    $('#target').className='target';
    $('#status').textContent='Жди зелёный сигнал…';

    const cfg=levels[level];
    timer=setTimeout(()=>{
      if(!running) return;
      readyAt=Date.now();
      $('#target').classList.add('ready');
      $('#target').disabled=false;
      $('#status').textContent='СЕЙЧАС!';
      timer=setTimeout(()=>{
        if(!running) return;
        running=false; readyAt=0;
        $('#target').className='target fail';
        $('#target').disabled=true;
        $('#sendBtn').disabled=false;
        $('#status').textContent='Не успел — раунд завершён';
        toast('Время вышло');
      },cfg.window);
    },rand(...cfg.delay));

    setTimeout(()=>{ if(!running) $('#sendBtn').disabled=false; }, 100);
  }

  function openModal(title,text){
    $('#modalTitle').textContent=title;
    $('#modalText').textContent=text;
    $('#modal').classList.add('show');
  }
  $('#aboutBtn').onclick=()=>openModal('Об игре','Демонстрационный Telegram Mini App. Выбирай сложность, ставку и запускай раунд. Все ⭐ в этом прототипе — виртуальные очки, данные сохраняются локально на устройстве.');
  $('#fairBtn').onclick=()=>openModal('Честная игра','В демо-версии результат определяется только таймером и твоим нажатием. Серверной генерации случайности и реальных денежных ставок здесь нет.');
  $('#closeModal').onclick=()=>$('#modal').classList.remove('show');
  $('#modal').onclick=e=>{if(e.target.id==='modal')$('#modal').classList.remove('show')};

  renderBalance();
})();
</script>
</body>
</html>
