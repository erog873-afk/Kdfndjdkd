<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
               maximum-scale=1.0, user-scalable=no">

<title>Frog Crash</title>

<script src="/socket.io/socket.io.js"></script>

<style>
:root{
  --bg:#050607;
  --panel:#1b1b1c;
  --panel2:#242425;
  --text:#f5f5f7;
  --muted:#858589;
  --green:#38e07b;
  --red:#ff4d5e;
  --purple:#7657ff;
  --purple2:#9a80ff;
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  color:var(--text);
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Roboto,
    Arial,
    sans-serif;
}

button,
input{
  font:inherit;
}

#app{
  position:relative;
  width:100%;
  height:100dvh;
  overflow:hidden;
  background:
    radial-gradient(
      circle at 50% 50%,
      rgba(35,90,30,.14),
      transparent 25%
    ),
    #000;
}

/* =========================
   STAR BACKGROUND
========================= */

#stars{
  position:absolute;
  inset:0;
  overflow:hidden;
  pointer-events:none;
}

.star{
  position:absolute;
  width:2px;
  height:2px;
  border-radius:50%;
  background:white;
  opacity:.2;
  animation:twinkle var(--duration) infinite ease-in-out;
}

@keyframes twinkle{
  0%,100%{
    opacity:.1;
    transform:scale(1);
  }

  50%{
    opacity:.8;
    transform:scale(1.5);
  }
}

/* =========================
   TOP
========================= */

.top{
  position:relative;
  z-index:5;

  height:72px;

  display:flex;
  align-items:center;
  justify-content:center;

  padding:0 16px;
}

.game-title{
  display:flex;
  align-items:center;
  gap:8px;

  font-size:18px;
  font-weight:750;
}

.frog{
  width:27px;
  height:27px;

  border-radius:50%;

  display:flex;
  align-items:center;
  justify-content:center;

  background:#20212a;

  font-size:15px;
}

.back{
  position:absolute;
  left:16px;

  border:0;
  background:none;

  color:white;
  font-size:15px;
  font-weight:600;
}

.menu{
  position:absolute;
  right:16px;

  border:0;
  background:none;

  color:white;

  font-size:26px;
}

/* =========================
   BALANCE
========================= */

.balance-bar{
  position:relative;
  z-index:5;

  display:flex;
  align-items:center;

  padding:0 14px;
}

.live{
  color:#ff5664;

  font-size:11px;
  font-weight:900;

  writing-mode:vertical-rl;

  letter-spacing:1px;
}

.balance{
  margin-left:auto;

  display:flex;
  align-items:center;
  gap:7px;

  padding:9px 15px;

  border-radius:22px;

  background:#1c1d22;

  font-size:14px;
  font-weight:750;
}

.plus{
  width:20px;
  height:20px;

  border-radius:50%;

  display:flex;
  align-items:center;
  justify-content:center;

  background:#fff;
  color:#000;

  font-size:15px;
  font-weight:800;
}

/* =========================
   GAME
========================= */

.game{
  position:absolute;
  z-index:2;

  left:0;
  right:0;

  top:120px;
  bottom:280px;

  display:flex;
  flex-direction:column;

  align-items:center;
  justify-content:center;
}

.multiplier{
  font-size:min(24vw,100px);

  line-height:1;

  font-weight:850;

  letter-spacing:-4px;

  transition:.2s;
}

.multiplier.running{
  color:#fff;
}

.multiplier.crashed{
  color:var(--red);

  transform:scale(1.04);
}

.status{
  margin-top:8px;

  color:var(--muted);

  font-size:13px;
  font-weight:650;
}

/* =========================
   HISTORY
========================= */

.history{
  position:absolute;

  z-index:5;

  left:0;
  right:0;
  bottom:226px;

  display:flex;

  gap:8px;

  padding:0 14px 10px;

  overflow-x:auto;

  scrollbar-width:none;
}

.history::-webkit-scrollbar{
  display:none;
}

.history-item{
  flex-shrink:0;

  min-width:92px;

  padding:12px 16px;

  text-align:center;

  border-radius:14px;

  background:
    linear-gradient(
      135deg,
      var(--purple),
      var(--purple2)
    );

  font-weight:800;
}

.history-item.low{
  background:#27282d;
  color:#a4a5ab;
}

/* =========================
   BETS
========================= */

.bets{
  position:absolute;

  z-index:5;

  left:8px;
  right:8px;
  bottom:72px;

  height:150px;

  overflow:hidden;

  padding:15px;

  border-radius:20px 20px 0 0;

  background:#121314;
}

.bets-header{
  display:flex;
  justify-content:space-between;

  color:var(--muted);

  font-size:13px;
  font-weight:600;

  margin-bottom:7px;
}

.empty{
  text-align:center;

  padding:30px 10px;

  color:var(--muted);

  font-size:14px;
}

.bet{
  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:7px 0;
}

.bet-left{
  display:flex;
  align-items:center;
  gap:9px;
}

.avatar{
  width:34px;
  height:34px;

  border-radius:50%;

  display:flex;
  align-items:center;
  justify-content:center;

  color:white;

  font-weight:800;
}

.bet-name{
  font-size:14px;
  font-weight:700;
}

.bet-money{
  color:#ffc94d;

  font-size:12px;
  font-weight:700;
}

.bet-coef{
  color:var(--muted);

  font-weight:800;
}

.bet-coef.win{
  color:var(--green);
}

.bet-coef.lost{
  color:var(--red);
}

/* =========================
   BOTTOM BUTTON
========================= */

.bottom{
  position:absolute;

  z-index:10;

  left:0;
  right:0;
  bottom:0;

  padding:
    10px
    14px
    calc(14px + env(safe-area-inset-bottom));

  background:#050607;
}

.main-button{
  width:100%;

  height:58px;

  border:0;

  border-radius:17px;

  background:white;
  color:#050505;

  font-size:17px;
  font-weight:850;

  transition:.15s;
}

.main-button:active{
  transform:scale(.98);
}

.main-button.cashout{
  background:#38e07b;
}

/* =========================
   MODAL
========================= */

.modal{
  position:fixed;

  z-index:100;

  inset:0;

  display:none;

  align-items:flex-end;

  background:rgba(0,0,0,.68);

  backdrop-filter:blur(8px);
}

.modal.show{
  display:flex;
}

.modal-box{
  width:100%;

  padding:
    28px
    28px
    calc(28px + env(safe-area-inset-bottom));

  border-radius:30px 30px 0 0;

  background:
    linear-gradient(
      180deg,
      #202021,
      #1b1b1c
    );

  box-shadow:
    0 -10px 40px rgba(0,0,0,.45);

  animation:modalUp .22s ease-out;
}

@keyframes modalUp{
  from{
    transform:translateY(100%);
  }

  to{
    transform:translateY(0);
  }
}

.modal-title{
  position:relative;

  text-align:center;

  font-size:26px;
  font-weight:800;

  margin-bottom:55px;
}

.close{
  position:absolute;

  top:4px;
  right:0;

  width:38px;
  height:38px;

  border:0;

  border-radius:50%;

  background:none;

  color:#aaa;

  font-size:36px;
  font-weight:300;

  line-height:30px;
}

/* =========================
   AMOUNT
========================= */

.amount{
  display:flex;
  align-items:center;
  justify-content:center;

  gap:8px;

  margin-bottom:30px;
}

.amount-number{
  width:150px;
  height:70px;

  padding:0;

  border:0;
  outline:0;

  background:transparent;

  color:#fff;

  text-align:center;

  font-size:52px;
  font-weight:800;

  line-height:1;

  appearance:textfield;
  -moz-appearance:textfield;
}

.amount-number::-webkit-outer-spin-button,
.amount-number::-webkit-inner-spin-button{
  margin:0;
  -webkit-appearance:none;
}

.amount-number:focus{
  outline:none;
}

.star-small{
  font-size:30px;

  line-height:1;

  filter:
    drop-shadow(
      0 2px 4px
      rgba(255,170,0,.25)
    );
}

/* =========================
   QUICK BUTTONS
========================= */

.quick{
  display:grid;

  grid-template-columns:
    repeat(3,1fr);

  gap:12px;
}

.quick button{
  height:60px;

  border:0;

  border-radius:18px;

  background:#505052;

  color:#fff;

  font-size:17px;
  font-weight:650;
}

.quick button:active{
  transform:scale(.97);
}

.min-label{
  text-align:center;

  color:#858589;

  font-size:15px;

  margin-top:17px;
}

/* =========================
   AUTO CASHOUT
========================= */

.auto{
  display:flex;

  align-items:center;
  justify-content:space-between;

  margin-top:72px;

  gap:15px;
}

.auto-left{
  display:flex;
  align-items:center;
  gap:14px;

  font-size:17px;
}

.checkbox{
  position:relative;

  width:56px;
  height:56px;

  border:3px solid white;

  border-radius:18px;

  cursor:pointer;
}

.checkbox.active{
  background:white;
}

.checkbox.active::after{
  content:"✓";

  position:absolute;

  left:50%;
  top:50%;

  transform:translate(-50%,-53%);

  color:#111;

  font-size:30px;
  font-weight:900;
}

.auto-control{
  display:flex;
  align-items:center;

  height:54px;

  border-radius:30px;

  background:#292a2c;

  overflow:hidden;
}

.auto-control button{
  width:52px;
  height:54px;

  border:0;

  background:none;

  color:#aaa;

  font-size:34px;

  line-height:1;
}

.auto-value{
  min-width:82px;

  text-align:center;

  color:#a5a5a8;

  font-size:20px;
  font-weight:700;
}

/* =========================
   SEND
========================= */

.send{
  width:100%;

  height:64px;

  margin-top:34px;

  border:0;

  border-radius:22px;

  background:#fff;

  color:#080808;

  font-size:20px;
  font-weight:800;
}

.send:active{
  transform:scale(.98);
}

/* =========================
   NOT ENOUGH
========================= */

.warning-title{
  margin-bottom:8px;

  font-size:27px;
  font-weight:800;
}

.warning-text{
  color:#99999d;

  font-size:18px;

  line-height:1.35;

  margin-bottom:42px;
}

.topup{
  width:100%;

  height:65px;

  border:0;

  border-radius:22px;

  background:#fff;

  color:#080808;

  font-size:20px;
  font-weight:800;
}

/* =========================
   TOAST
========================= */

.toast{
  position:fixed;

  z-index:200;

  left:50%;
  bottom:90px;

  transform:
    translate(-50%,20px);

  opacity:0;

  pointer-events:none;

  padding:13px 20px;

  border-radius:15px;

  background:#29292b;

  color:#fff;

  font-weight:700;

  transition:.2s;
}

.toast.show{
  transform:
    translate(-50%,0);

  opacity:1;
}
</style>
</head>

<body>

<div id="app">

  <div id="stars"></div>

  <!-- HEADER -->

  <header class="top">

    <button class="back"
            onclick="history.back()">
      ← Назад
    </button>

    <div class="game-title">
      <span class="frog">🐸</span>
      Frog Crash
    </div>

    <button class="menu">
      ⋮
    </button>

  </header>


  <!-- BALANCE -->

  <div class="balance-bar">

    <div class="live">
      LIVE
    </div>

    <div class="balance"
         onclick="openBetModal()">

      ⭐
      <span id="balance">
        0
      </span>

      <span class="plus">
        +
      </span>

    </div>

  </div>


  <!-- GAME -->

  <main class="game">

    <div
      id="multiplier"
      class="multiplier">
      x1.00
    </div>

    <div
      id="status"
      class="status">
      Ожидание
    </div>

  </main>


  <!-- HISTORY -->

  <div
    id="history"
    class="history">
  </div>


  <!-- BETS -->

  <section class="bets">

    <div class="bets-header">

      <span>
        Пользователь
      </span>

      <span>
        Коэффициент
      </span>

    </div>

    <div id="betsList">

      <div class="empty">
        Сделайте первую ставку!
      </div>

    </div>

  </section>


  <!-- BOTTOM -->

  <footer class="bottom">

    <button
      id="mainButton"
      class="main-button"
      onclick="openBetModal()">

      Сделать ставку

    </button>

  </footer>


  <!-- ======================
       BET MODAL
  ======================= -->

  <div
    id="betModal"
    class="modal">

    <div class="modal-box">

      <div class="modal-title">

        Новая ставка

        <button
          class="close"
          onclick="closeModal('betModal')">

          ×

        </button>

      </div>


      <div class="amount">

        <input
          id="betAmountInput"
          class="amount-number"
          type="number"
          min="25"
          step="1"
          value="25"
          inputmode="numeric"
          autocomplete="off"
          oninput="manualAmountChange()">

        <span class="star-small">
          ⭐
        </span>

      </div>


      <div class="quick">

        <button onclick="addAmount(100)">
          + 100
        </button>

        <button onclick="addAmount(500)">
          + 500
        </button>

        <button onclick="addAmount(2500)">
          + 2 500
        </button>

      </div>


      <div class="min-label">
        от 25 звёзд
      </div>


      <div class="auto">

        <div class="auto-left">

          <div
            id="checkbox"
            class="checkbox"
            onclick="toggleAuto()">
          </div>

          <span>
            Авто вывод
          </span>

        </div>


        <div class="auto-control">

          <button onclick="changeAuto(-0.10)">
            −
          </button>

          <div class="auto-value">
            x<span id="autoValue">
              1.10
            </span>
          </div>

          <button onclick="changeAuto(0.10)">
            +
          </button>

        </div>

      </div>


      <button
        class="send"
        onclick="sendBet()">

        Отправить ставку

      </button>

    </div>

  </div>


  <!-- ======================
       NOT ENOUGH MODAL
  ======================= -->

  <div
    id="notEnoughModal"
    class="modal">

    <div class="modal-box">

      <div class="modal-title">

        <button
          class="close"
          onclick="closeModal('notEnoughModal')">

          ×

        </button>

        <div class="warning-title">
          Не хватает звёзд!
        </div>

        <div
          id="notEnoughText"
          class="warning-text">

          Нужно еще 25 stars.
          Пополните баланс.

        </div>

      </div>


      <button
        class="topup"
        onclick="topUp()">

        Пополнить баланс

      </button>

    </div>

  </div>


  <div
    id="toast"
    class="toast">
  </div>

</div>


<script>

/* =========================================================
   CONFIG
========================================================= */

const MIN_BET = 25;
const MIN_AUTO = 1.10;
const AUTO_STEP = 0.10;


/* =========================================================
   STATE
========================================================= */

let balance = 0;

let betAmount = MIN_BET;

let autoEnabled = false;

let autoMultiplier = MIN_AUTO;

let currentMultiplier = 1;

let phase = "waiting";

let currentBet = null;

let historyData = [];

let socket = null;


/* =========================================================
   ELEMENTS
========================================================= */

const balanceEl =
  document.getElementById("balance");

const betAmountInput =
  document.getElementById("betAmountInput");

const autoValueEl =
  document.getElementById("autoValue");

const checkboxEl =
  document.getElementById("checkbox");

const multiplierEl =
  document.getElementById("multiplier");

const statusEl =
  document.getElementById("status");

const mainButton =
  document.getElementById("mainButton");

const historyEl =
  document.getElementById("history");

const betsList =
  document.getElementById("betsList");


/* =========================================================
   STARFIELD
========================================================= */

const stars =
  document.getElementById("stars");

for(let i = 0; i < 70; i++){

  const star =
    document.createElement("div");

  star.className = "star";

  star.style.left =
    Math.random() * 100 + "%";

  star.style.top =
    Math.random() * 100 + "%";

  const size =
    Math.random() * 2 + 1;

  star.style.width =
    size + "px";

  star.style.height =
    size + "px";

  star.style.setProperty(
    "--duration",
    (2 + Math.random() * 4) + "s"
  );

  star.style.animationDelay =
    Math.random() * 4 + "s";

  stars.appendChild(star);
}


/* =========================================================
   BALANCE
========================================================= */

function setBalance(value){

  balance =
    Math.max(0, Number(value) || 0);

  balanceEl.textContent =
    balance.toLocaleString("ru-RU");
}


/* =========================================================
   BET MODAL
========================================================= */

function openBetModal(){

  if(phase === "running"){

    showToast(
      "Ставку можно сделать до начала раунда"
    );

    return;
  }

  betAmount = Math.max(
    MIN_BET,
    Number(betAmount) || MIN_BET
  );

  renderBet();

  document
    .getElementById("betModal")
    .classList.add("show");
}


function closeModal(id){

  document
    .getElementById(id)
    .classList.remove("show");
}


/* =========================================================
   BET AMOUNT
========================================================= */

function addAmount(value){

  manualAmountChange();

  betAmount += Number(value) || 0;

  betAmount =
    Math.max(
      MIN_BET,
      Math.floor(betAmount)
    );

  renderBet();
}


function manualAmountChange(){

  let value =
    parseInt(
      betAmountInput.value,
      10
    );

  if(isNaN(value)){

    betAmount =
      MIN_BET;

    return;
  }

  value =
    Math.floor(value);

  if(value < MIN_BET){

    betAmount =
      value;

    return;
  }

  betAmount =
    value;
}


function renderBet(){

  betAmountInput.value =
    betAmount;

  autoValueEl.textContent =
    autoMultiplier.toFixed(2);
}


/* =========================================================
   AUTO CASHOUT
========================================================= */

function toggleAuto(){

  autoEnabled =
    !autoEnabled;

  checkboxEl.classList.toggle(
    "active",
    autoEnabled
  );
}


function changeAuto(value){

  autoMultiplier += value;

  autoMultiplier =
    Math.max(
      MIN_AUTO,
      autoMultiplier
    );

  autoMultiplier =
    Number(
      autoMultiplier.toFixed(2)
    );

  renderBet();
}


/* =========================================================
   SEND BET
========================================================= */

function sendBet(){

  manualAmountChange();

  /*
   * Если поле пустое или меньше
   * минимальной ставки — ставим 25.
   */

  if(
    !Number.isFinite(betAmount) ||
    betAmount < MIN_BET
  ){

    betAmount =
      MIN_BET;

    renderBet();

    showToast(
      "Минимальная ставка — 25 ⭐"
    );

    return;
  }


  betAmount =
    Math.floor(betAmount);


  /*
   * Проверяем баланс на клиенте,
   * но сервер должен проверить его
   * повторно.
   */

  if(balance < betAmount){

    const missing =
      betAmount - balance;

    document.getElementById(
      "notEnoughText"
    ).textContent =
      `Нужно еще ${missing.toLocaleString("ru-RU")} stars. Пополните баланс.`;

    closeModal("betModal");

    document
      .getElementById("notEnoughModal")
      .classList.add("show");

    return;
  }


  const data = {

    amount: betAmount,

    autoCashout:
      autoEnabled,

    autoMultiplier:
      autoEnabled
        ? Math.max(
            MIN_AUTO,
            autoMultiplier
          )
        : null

  };


  /*
   * ONLINE
   */

  if(socket){

    socket.emit(
      "bet",
      data
    );

  }else{

    showToast(
      "Сервер пока не подключён"
    );

  }

}


/* =========================================================
   CASH OUT
========================================================= */

function cashOut(){

  if(!socket){

    showToast(
      "Сервер не подключён"
    );

    return;
  }

  socket.emit(
    "cashout"
  );
}


/* =========================================================
   TOP UP
========================================================= */

function topUp(){

  closeModal(
    "notEnoughModal"
  );

  /*
   * Здесь позже можно открыть
   * отдельный экран получения
   * виртуальных ⭐.
   */

  showToast(
    "Экран пополнения будет здесь"
  );
}


/* =========================================================
   MAIN BUTTON
========================================================= */

function updateMainButton(){

  if(phase === "running" && currentBet){

    mainButton.textContent =
      `Забрать x${currentMultiplier.toFixed(2)}`;

    mainButton.classList.add(
      "cashout"
    );

    mainButton.onclick =
      cashOut;

    return;
  }


  mainButton.textContent =
    "Сделать ставку";

  mainButton.classList.remove(
    "cashout"
  );

  mainButton.onclick =
    openBetModal;
}


/* =========================================================
   MULTIPLIER
========================================================= */

function updateMultiplier(value){

  currentMultiplier =
    Number(value);

  if(!Number.isFinite(currentMultiplier)){
    return;
  }

  multiplierEl.textContent =
    "x" + currentMultiplier.toFixed(2);

  statusEl.textContent =
    "x" + currentMultiplier.toFixed(2);

  multiplierEl.classList.add(
    "running"
  );

  multiplierEl.classList.remove(
    "crashed"
  );

  updateMainButton();

}


/* =========================================================
   ROUND WAITING
========================================================= */

function roundWaiting(data){

  phase =
    "waiting";

  currentBet =
    null;

  multiplierEl.classList.remove(
    "running",
    "crashed"
  );

  multiplierEl.textContent =
    data && data.countdown !== undefined
      ? data.countdown
      : "Ожидание";

  statusEl.textContent =
    "Ожидание";

  updateMainButton();
}


/* =========================================================
   ROUND START
========================================================= */

function roundStart(){

  phase =
    "running";

  multiplierEl.classList.add(
    "running"
  );

  statusEl.textContent =
    "x1.00";

  multiplierEl.textContent =
    "x1.00";

  currentMultiplier =
    1;

  updateMainButton();
}


/* =========================================================
   ROUND CRASH
========================================================= */

function roundCrash(data){

  phase =
    "crashed";

  currentMultiplier =
    Number(data.multiplier);

  multiplierEl.textContent =
    "x" +
    currentMultiplier.toFixed(2);

  statusEl.textContent =
    "x" +
    currentMultiplier.toFixed(2);

  multiplierEl.classList.remove(
    "running"
  );

  multiplierEl.classList.add(
    "crashed"
  );

  historyData.push(
    currentMultiplier
  );

  renderHistory();

  currentBet =
    null;

  updateMainButton();
}


/* =========================================================
   HISTORY
========================================================= */

function renderHistory(){

  historyEl.innerHTML = "";

  historyData
    .slice(-8)
    .reverse()
    .forEach(value => {

      const item =
        document.createElement("div");

      item.className =
        "history-item";

      if(value < 2){

        item.classList.add(
          "low"
        );

      }

      item.textContent =
        "x" + value.toFixed(2);

      historyEl.appendChild(
        item
      );

    });
}


/* =========================================================
   BET LIST
========================================================= */

function renderBets(bets){

  if(!bets || !bets.length){

    betsList.innerHTML =
      `<div class="empty">
        Сделайте первую ставку!
      </div>`;

    return;
  }


  betsList.innerHTML =
    bets.map(b => {

      let state =
        "";

      if(b.cashedOut){

        state =
          "win";

      }else if(b.lost){

        state =
          "lost";
      }


      return `

        <div class="bet">

          <div class="bet-left">

            <div
              class="avatar"
              style="background:${b.color || "#7657ff"}">

              ${(b.username || "U")
                .charAt(0)
                .toUpperCase()}

            </div>

            <div>

              <div class="bet-name">
                ${escapeHtml(
                  b.username || "Player"
                )}
              </div>

              <div class="bet-money">
                ⭐ ${Number(
                  b.amount || 0
                ).toLocaleString("ru-RU")}
              </div>

            </div>

          </div>

          <div
            class="bet-coef ${state}">

            x${Number(
              b.cashout || b.multiplier || 1
            ).toFixed(2)}

          </div>

        </div>

      `;

    }).join("");
}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(value){

  return String(value)

    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}


/* =========================================================
   TOAST
========================================================= */

let toastTimer;

function showToast(message){

  const toast =
    document.getElementById(
      "toast"
    );

  toast.textContent =
    message;

  toast.classList.add(
    "show"
  );

  clearTimeout(
    toastTimer
  );

  toastTimer =
    setTimeout(() => {

      toast.classList.remove(
        "show"
      );

    },2500);
}


/* =========================================================
   SOCKET.IO
========================================================= */

function connectSocket(){

  /*
   * Если index.html отдаётся
   * тем же Node.js сервером:
   */

  try{

    socket =
      io();

  }catch(error){

    console.error(
      "Socket error:",
      error
    );

    socket =
      null;

    return;
  }


  socket.on(
    "connect",
    () => {

      console.log(
        "Connected:",
        socket.id
      );


      let username =
        localStorage.getItem(
          "frog_username"
        );


      if(!username){

        username =
          prompt(
            "Введите ник:"
          ) ||
          "Player";

        localStorage.setItem(
          "frog_username",
          username
        );

      }


      socket.emit(
        "login",
        username
      );

    }
  );


  /*
   * ACCOUNT
   */

  socket.on(
    "account",
    data => {

      if(data){

        setBalance(
          data.balance
        );

      }

    }
  );


  /*
   * WAITING
   */

  socket.on(
    "round:waiting",
    data => {

      roundWaiting(
        data || {}
      );

    }
  );


  /*
   * ROUND STATE
   */

  socket.on(
    "round:state",
    data => {

      if(!data){
        return;
      }

      phase =
        data.running
          ? "running"
          : "waiting";

      if(data.multiplier !== undefined){

        updateMultiplier(
          data.multiplier
        );

      }

      updateMainButton();

    }
  );


  /*
   * START
   */

  socket.on(
    "round:start",
    () => {

      roundStart();

    }
  );


  /*
   * UPDATE
   */

  socket.on(
    "round:update",
    data => {

      if(
        data &&
        data.multiplier !== undefined
      ){

        updateMultiplier(
          data.multiplier
        );

      }

    }
  );


  /*
   * CRASH
   */

  socket.on(
    "round:crash",
    data => {

      if(data){

        roundCrash(
          data
        );

      }

    }
  );


  /*
   * BET ACCEPTED
   */

  socket.on(
    "bet:accepted",
    data => {

      currentBet =
        data;

      closeModal(
        "betModal"
      );

      showToast(
        "Ставка принята ⭐"
      );

      if(
        data &&
        data.balance !== undefined
      ){

        setBalance(
          data.balance
        );

      }

      updateMainButton();

    }
  );


  /*
   * BET ERROR
   */

  socket.on(
    "bet:error",
    message => {

      showToast(
        typeof message === "string"
          ? message
          : "Ошибка ставки"
      );

    }
  );


  /*
   * NEW BETS
   */

  socket.on(
    "bets:update",
    bets => {

      renderBets(
        bets
      );

    }
  );


  /*
   * CASHOUT SUCCESS
   */

  socket.on(
    "cashout:success",
    data => {

      currentBet =
        null;

      if(
        data &&
        data.balance !== undefined
      ){

        setBalance(
          data.balance
        );

      }

      if(data){

        showToast(
          `Cash Out x${Number(
            data.multiplier
          ).toFixed(2)} · +${Number(
            data.win
          ).toLocaleString("ru-RU")} ⭐`
        );

      }

      updateMainButton();

    }
  );


  /*
   * CASHOUT ERROR
   */

  socket.on(
    "cashout:error",
    message => {

      showToast(
        typeof message === "string"
          ? message
          : "Ошибка вывода"
      );

    }
  );


  /*
   * SERVER DISCONNECTED
   */

  socket.on(
    "disconnect",
    () => {

      showToast(
        "Соединение с сервером потеряно"
      );

    }
  );

}

/* =========================================================

setBalance(0);

renderBet();

renderHistory();

updateMainButton();

connectSocket();

</script>
