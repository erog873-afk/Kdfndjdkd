<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Gift Apex</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
:root{
  --primary:#8774e1;
  --secondary:#f5f5f5;
  --main:#ffffff;
  --separator:rgba(0,0,0,.10);
  --subtitle:#9a9a9a;
  --button:#3b9dff;
  --tg-safe-area-inset-bottom:0px;
}

*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  min-height:100%;
  background:#ffffff;
  color:#111;
  font-family:Arial,Helvetica,sans-serif;
}

.demo{
  min-height:100vh;
  padding:24px 16px 120px;
  max-width:600px;
  margin:auto;
}

.demo h2{
  font-size:20px;
  margin:10px 0;
}

.demo p{
  color:#777;
  font-size:14px;
}

/* Нижняя панель */
.bottom-nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  z-index:50;

  display:grid;
  grid-template-columns:1fr auto;
  align-items:stretch;
  gap:8px;

  padding:0 16px;
  padding-bottom:calc(var(--tg-safe-area-inset-bottom) + .7rem);
}

.bottom-nav::before{
  content:"";
  position:absolute;
  inset:0;

  background:linear-gradient(
    to bottom,
    transparent,
    #ffffff
  );

  pointer-events:none;
}

/* Большая панель */
.nav-pill{
  position:relative;

  display:flex;
  align-items:center;

  border:1px solid var(--separator);
  border-radius:999px;

  background:rgba(255,255,255,.85);

  padding:8px 4px;

  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);

  box-shadow:0 2px 16px rgba(0,0,0,.08);
}

/* Активный фон */
.active-indicator{
  position:absolute;

  top:4px;
  bottom:4px;

  border-radius:999px;

  background:rgba(0,0,0,.05);
  border:1px solid rgba(0,0,0,.06);

  transition:all .3s ease-out;

  pointer-events:none;
  opacity:1;
}

/* Кнопки Игры / Кейсы / Лидеры */
.nav-item{
  position:relative;
  z-index:10;

  flex:1;

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;

  padding:4px 6px;

  min-width:72px;

  color:var(--subtitle);

  text-decoration:none;

  -webkit-tap-highlight-color:transparent;
}

.nav-item.active{
  color:var(--button);
}

.nav-item svg{
  width:26px;
  height:26px;

  margin-bottom:4px;

  flex:none;
}

.nav-item span{
  font-size:12px;
  line-height:1;
  font-weight:500;
}

/* =========================
   ПРОФИЛЬ
   ========================= */

.profile{
  position:relative;

  display:flex;
  align-items:center;
  justify-content:center;

  width:72px;
  height:72px;

  min-width:72px;
  min-height:72px;

  border-radius:50%;

  /* Видимый круглый фон */
  background:rgba(255,255,255,.92);

  /* Видимая граница */
  border:2px solid rgba(0,0,0,.10);

  /* Расстояние между кругом и аватаркой */
  padding:5px;

  /* Дополнительное белое кольцо */
  box-shadow:
    0 2px 16px rgba(0,0,0,.10),
    0 0 0 3px rgba(255,255,255,.75);

  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);

  overflow:hidden;

  /* Немного ниже большой панели */
  align-self:center;
  transform:translateY(7px);

  text-decoration:none;
  -webkit-tap-highlight-color:transparent;
}

/* Аватар внутри кругляшка */
.profile img{
  display:block;

  width:100%;
  height:100%;

  border-radius:50%;

  object-fit:cover;
}

/* Если аватар Telegram недоступен */
.profile .fallback{
  width:100%;
  height:100%;

  border-radius:50%;

  display:flex;
  align-items:center;
  justify-content:center;

  background:var(--primary);

  color:#fff;

  font-size:20px;
  font-weight:600;
}

/* Маленькие экраны */
@media(max-width:380px){

  .nav-item{
    min-width:58px;

    padding-left:2px;
    padding-right:2px;
  }

  .nav-item svg{
    width:24px;
    height:24px;
  }

  .profile{
    width:66px;
    height:66px;

    min-width:66px;
    min-height:66px;
  }
}
</style>
</head>

<script>
const items = [...document.querySelectorAll('.nav-item')];
const indicator = document.querySelector('.active-indicator');

function moveIndicator(item){
  if(!item) return;

  indicator.style.width = item.offsetWidth + 'px';
  indicator.style.left = item.offsetLeft + 'px';
}

items.forEach(item => {

  item.addEventListener('click', (e) => {

    e.preventDefault();

    items.forEach(x => x.classList.remove('active'));
    items.forEach(x => x.removeAttribute('aria-current'));

    item.classList.add('active');
    item.setAttribute('aria-current','page');

    requestAnimationFrame(() => moveIndicator(item));
  });

});

window.addEventListener('resize', () => {
  moveIndicator(document.querySelector('.nav-item.active'));
});

requestAnimationFrame(() => {
  moveIndicator(document.querySelector('.nav-item.active'));
});


/* ==========================================
   АВАТАР ПОЛЬЗОВАТЕЛЯ ИЗ TELEGRAM MINI APP
   ========================================== */

(function(){

  const profileBtn = document.getElementById('profileBtn');

  let user = null;

  try{

    if(window.Telegram && window.Telegram.WebApp){

      window.Telegram.WebApp.ready();

      user =
        window.Telegram.WebApp.initDataUnsafe &&
        window.Telegram.WebApp.initDataUnsafe.user;
    }

  }catch(e){}


  function showFallback(name){

    const letter =
      (name || '?')
      .trim()
      .charAt(0)
      .toUpperCase();

    const div = document.createElement('div');

    div.className = 'fallback';

    div.textContent = letter;

    profileBtn.innerHTML = '';

    profileBtn.appendChild(div);
  }


  if(user && user.photo_url){

    const img = document.createElement('img');

    img.alt = 'Профиль';

    img.src = user.photo_url;

    img.onerror = () => {
      showFallback(user.first_name);
    };

    profileBtn.appendChild(img);

  }else{

    showFallback(
      user && user.first_name
    );

  }

})();
</script>
