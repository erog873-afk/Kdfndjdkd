<div class="container" style="margin-top:64px">
    <div class="flexer" style="margin-bottom:4px">
        <img src="https://chimpbot.org/assets/stars-BaCoVmhq.svg" class="star_logo">
        <p id="stars_balance_profile" class="balance-value" style="font-size:x-large">0</p>
    </div>
    <p class="hint_text">Баланс звёзд</p>
    <div class="flexer" style="margin-top:12px">
        <button class="btn" id="openWithdraw">Вывести</button>
        <button class="btn white_btn" id="openTopupFromProfile">Пополнить</button>
    </div>
</div>

<div class="container invite-card">
    <img src="https://client.frogstar.app/static/media/alien.e5276f43aa6239c533b8.png" class="invite-emoji" alt="">
    <div class="invite-title">Пригласите друзей</div>
    <div class="invite-desc">И зарабатывайте звезды за каждого приглашенного, а так же 10% от их пополнений баланса!</div>
    <button class="invite-btn" id="inviteFriendsBtn">Пригласить <span class="invite-badge">+ 2 <img src="https://chimpbot.org/assets/stars-BaCoVmhq.svg"></span></button>
</div>

<div class="container inventory-card" id="inventoryCard">
    <div class="inventory-title">Инвентарь</div>
    <div class="inventory-balance-pill"><img src="https://chimpbot.org/assets/stars-BaCoVmhq.svg"><span id="inventoryTotal">0</span></div>
    <div class="inventory-grid" id="inventoryGrid"></div>
</div>
