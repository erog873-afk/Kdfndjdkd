<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Админ-панель — задания</title><style>*{box-sizing:border-box}body{margin:0;background:#111216;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}.wrap{max-width:760px;margin:0 auto;padding:24px 16px 60px}h1{font-size:26px;margin:0 0 20px}.panel,.task{background:#1c1d22;border-radius:20px;padding:18px;margin-bottom:14px}label{display:block;color:#a5a6aa;font-size:13px;margin:12px 0 6px}input,textarea{width:100%;border:0;outline:0;border-radius:12px;background:#292a30;color:#fff;padding:12px;font-size:15px}textarea{min-height:80px;resize:vertical}button{border:0;border-radius:12px;padding:12px 16px;font-weight:700;cursor:pointer}.primary{background:#fff;color:#111;margin-top:16px;width:100%}.danger{background:#3a2022;color:#ffb5b5}.row{display:flex;gap:10px;align-items:center}.row>*{flex:1}.task h3{margin:0 0 6px;font-size:18px}.muted{color:#96979d;font-size:14px}.reward{font-weight:700;white-space:nowrap}#status{margin:10px 0;color:#aeb0b5;font-size:14px}</style></head><body><div class="wrap"><h1>Админ-панель заданий</h1><div class="panel"><label>Пароль администратора</label><input id="password" type="password" placeholder="ADMIN_PASSWORD"><button class="primary" onclick="savePassword()">Сохранить пароль</button></div><div class="panel"><h2 style="margin:0">Добавить задание</h2><p class="muted" style="margin:10px 0 0">Для каждого задания нужно указать только ссылку на канал.</p><label>Ссылка на канал</label><input id="url" type="url" placeholder="https://t.me/example"><button class="primary" onclick="addTask()">Добавить задание</button><div id="status"></div></div><h2>Активные задания</h2><div id="tasks"></div></div><script>const KEY="admin_password";function savePassword(){const p=document.getElementById("password").value.trim();if(!p){alert("Введите пароль");return}localStorage.setItem(KEY,p);loadTasks()}function password(){return localStorage.getItem(KEY)||document.getElementById("password").value.trim()}function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"})[c])}async function loadTasks(){const b=document.getElementById("tasks");try{const r=await fetch("/api/tasks",{cache:"no-store"}),ts=await r.json();b.innerHTML="";if(!ts.length){b.innerHTML='<div class="muted">Заданий пока нет.</div>';return}ts.forEach(t=>{const e=document.createElement("div");e.className="task";e.innerHTML=`<div class="row"><div><h3>${esc(t.title)}</h3><div class="muted">${esc(t.description||"")}</div></div><div class="reward">⭐ ${esc(t.reward)}</div></div><div class="row" style="margin-top:12px"><div class="muted">${esc(t.type||"")}</div><button class="danger" onclick="deleteTask('${esc(t.id)}')">Удалить</button></div>`;b.appendChild(e)})}catch(e){b.innerHTML='<div class="muted">Не удалось загрузить задания.</div>'}}async function addTask(){const d={title:"Подписаться на канал",description:"Подпишитесь на канал",reward:0.5,url:document.getElementById("url").value.trim(),type:"Подписка на канал"};if(!d.url){alert("Укажите ссылку на канал");return}const r=await fetch("/api/tasks",{method:"POST",headers:{"Content-Type":"application/json","X-Admin-Password":password()},body:JSON.stringify(d)});if(!r.ok){document.getElementById("status").textContent="Ошибка: "+await r.text();return}document.getElementById("status").textContent="Задание добавлено.";document.getElementById("url").value="";loadTasks()}async function deleteTask(id){if(!confirm("Удалить задание?"))return;const r=await fetch("/api/tasks/"+encodeURIComponent(id),{method:"DELETE",headers:{"X-Admin-Password":password()}});if(!r.ok){alert("Ошибка удаления");return}loadTasks()}document.getElementById("password").value=localStorage.getItem(KEY)||"";loadTasks();</script></body></html>
